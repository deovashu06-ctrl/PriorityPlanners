<html lang="en">

<title>SlotWise – Smart. Conflict-free. Always up to date.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
:root{--bg:#050505;--surface:#0e0d0b;--border:#2c2a22;--ink:#e8e3cf;--mute:#9a957d;--primary:#e3131b;--on-primary:#fff;--s1:#e3131b;--s2:#b6b095;--s3:#c4553f;--s4:#d9a441;--s5:#7d7a68;--ok:#34D399;--warn:#FBBF24;--err:#ff4d4d;--info:#38BDF8;--tint:#1a1714;
--sans:"Space Grotesk",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--mono:"JetBrains Mono",ui-monospace,monospace;--display:"Federant","Uncial Antiqua","Iowan Old Style","Palatino Linotype",Georgia,serif;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#efe9d6;--surface:#f8f4e6;--border:#d6cfb6;--ink:#1a1512;--mute:#6b6553;--primary:#c40f16;--s1:#c40f16;--s2:#5c5744;--s3:#a3402d;--s4:#8a6a1c;--s5:#8c8770;--ok:#047857;--warn:#B45309;--err:#b91c1c;--info:#0369A1;--tint:#e6dfc8}}
:root[data-theme="light"]{--bg:#efe9d6;--surface:#f8f4e6;--border:#d6cfb6;--ink:#1a1512;--mute:#6b6553;--primary:#c40f16;--s1:#c40f16;--s2:#5c5744;--s3:#a3402d;--s4:#8a6a1c;--s5:#8c8770;--ok:#047857;--warn:#B45309;--err:#b91c1c;--info:#0369A1;--tint:#e6dfc8}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:calc(72px + env(safe-area-inset-top,0px));scroll-behavior:smooth;background:var(--bg)}
h1,h2{font-family:var(--display);font-weight:400;letter-spacing:.01em}
html:not(.auth) body>:not(#gate):not(script){display:none!important}
html.auth #gate{display:none}
.dash{display:none;width:100%;height:100vh;height:100svh;border:0;background:#050505}
html.auth[data-role=admin] #view-admin,html.auth[data-role=faculty] #view-faculty,html.auth[data-role=student] #view-student{display:block}
html.auth body>:not(.dash):not(script){display:none!important}
#gate{position:relative;min-height:100vh;min-height:100svh;display:grid;place-items:center;padding:32px 20px;background:#050505;color:#b6b095;font-family:var(--display);overflow:hidden}
#gate::before{content:"";position:absolute;inset:0;background:radial-gradient(45% 55% at 50% 42%,#e3131b33,#e3131b0f 55%,transparent 100%),radial-gradient(120% 90% at 50% 45%,transparent 55%,#b6b09514 100%)}
#gate .g-in{position:relative;z-index:1;width:100%;max-width:420px;text-align:center}
#gate .g-mark{display:block;margin:0 auto 12px}
#gate h1{margin:0;font-size:clamp(44px,12vw,72px);line-height:1;color:#b6b095}
#gate .g-sub{margin:8px 0 28px;font:11px var(--sans);letter-spacing:.3em;text-transform:uppercase;color:#e3131b}
#gate .g-card{text-align:left;background:#0e0d0b;border:1px solid #2c2a22;border-radius:14px;padding:22px;font-family:var(--sans)}
#gate .g-roles{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:18px}
#gate .g-roles button{height:40px;border-radius:8px;border:1px solid #2c2a22;background:transparent;color:#9a957d;font:600 13px var(--sans);cursor:pointer;transition:background .15s,color .15s,border-color .15s}
#gate .g-roles button[aria-checked=true]{background:#e3131b;border-color:#e3131b;color:#fff}
#gate label{display:block;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#9a957d;margin:0 0 6px}
#gate .g-f{position:relative;margin-bottom:14px}
#gate input{width:100%;height:44px;box-sizing:border-box;padding:0 14px;border-radius:8px;border:1px solid #2c2a22;background:#050505;color:#e8e3cf;font:15px var(--sans)}
#gate input:focus{outline:2px solid #e3131b;outline-offset:1px}
#gate .g-eye{position:absolute;right:6px;bottom:6px;height:32px;padding:0 10px;border:0;background:none;color:#9a957d;font:600 12px var(--sans);cursor:pointer}
#gate .g-err{min-height:20px;margin:0 0 8px;font-size:13px;color:#ff6b6b}
#gate .g-go{width:100%;height:46px;border-radius:8px;border:0;background:#e3131b;color:#fff;font:600 15px var(--sans);cursor:pointer}
#gate .g-go:hover{filter:brightness(1.1)}
#gate .g-hint{margin:14px 0 0;font-size:12px;line-height:1.5;color:#9a957d;text-align:center}
#gate .g-hint code{font-family:var(--mono);color:#e8e3cf}
#gate .g-hint button{background:none;border:0;padding:0;color:#e3131b;font:inherit;cursor:pointer;text-decoration:underline}
#front{position:relative;height:100vh;height:100svh;min-height:520px;background:#050505;color:#b6b095;overflow:hidden;font-family:var(--display)}
#front::before{content:"";position:absolute;inset:0;background:radial-gradient(40% 55% at 50% 45%,#e3131b3d,#e3131b12 55%,transparent 100%),radial-gradient(120% 90% at 50% 45%,transparent 55%,#b6b09514 100%)}
#lys-bg{position:absolute;inset:0;width:100%;height:100%;z-index:1;pointer-events:none}
#front .fw{position:absolute;left:50%;top:61%;transform:translate(-50%,-50%);font-size:min(21vw,33vh);line-height:1;white-space:nowrap;z-index:0;user-select:none}
#front .fr{position:absolute;z-index:2;left:5vw;right:5vw;display:flex;justify-content:space-between;align-items:flex-start;gap:24px}
#front .fr.t{top:5vh}#front .fr.b{bottom:5vh;align-items:flex-end}
#front .ft{font-size:clamp(20px,3.3vw,46px);line-height:.88;text-transform:uppercase}
#front .fp,#front ul{margin:0;padding:0;list-style:none;font-size:clamp(10px,.95vw,13px);line-height:1.35}
#front .fp{max-width:25vw;text-align:justify}
#front .fy{display:flex;align-items:center;gap:12px;font-family:var(--sans);font-size:clamp(20px,2.4vw,34px);font-weight:300}
#front .fy small{font-size:9px;line-height:1.2;letter-spacing:.08em;text-transform:uppercase;border-bottom:1px solid #b6b09580;padding-bottom:6px}
#front .cta{margin:0}
#front .btn{font-family:var(--sans)}
#front .btn.sec{background:transparent;color:#b6b095;border-color:#b6b09566}
#front .so{display:none;position:absolute;z-index:3;right:5vw;top:5vh;font:600 11px var(--sans);letter-spacing:.14em;text-transform:uppercase;color:#b6b095;border:1px solid #b6b09566;border-radius:8px;padding:8px 12px;text-decoration:none}
#front .cue2{position:absolute;z-index:2;left:50%;bottom:5vh;transform:translateX(-50%);font:9px var(--sans);letter-spacing:.3em;text-transform:uppercase;color:#e3131b}
@media(max-width:760px){#front .so{display:block}}
@media(max-width:900px){#front .fp,#front ul{display:none}#front .cue2{display:none}#front .fr.b{flex-direction:column;align-items:flex-start;gap:16px}}
body{margin:0;background:transparent;color:var(--ink);font:400 16px/24px var(--sans);-webkit-font-smoothing:antialiased}
a{color:inherit}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px;border-radius:6px}
.wrap{max-width:1280px;margin:0 auto;padding:0 24px}
h1,h2,h3{margin:0;letter-spacing:-.02em}
h1{font-size:clamp(34px,5vw,56px);line-height:1.06;font-weight:700}
h2{font-size:clamp(26px,3.2vw,38px);line-height:1.15;font-weight:700}
h3{font-size:18px;line-height:26px;font-weight:600;letter-spacing:-.01em}
p{margin:0}.mute{color:var(--mute)}
nav.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--border);padding-top:env(safe-area-inset-top,0px)}
nav.top .wrap{display:flex;align-items:center;gap:24px;height:64px}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:18px;text-decoration:none;letter-spacing:-.02em}
.logo i{width:28px;height:28px;border-radius:8px;background:var(--primary);display:grid;place-items:center;color:var(--on-primary);font-style:normal;font-size:14px}
.links{display:flex;gap:4px;margin-left:auto}
.links a{padding:10px 12px;text-decoration:none;color:var(--mute);font-size:14px;border-radius:8px;transition:color .15s}
.links a:hover{color:var(--ink)}
.btn{display:inline-flex;align-items:center;justify-content:center;height:40px;padding:0 16px;border-radius:8px;font:600 14px var(--sans);text-decoration:none;border:1px solid var(--primary);background:var(--primary);color:var(--on-primary);cursor:pointer;transition:filter .15s,background .15s;min-width:44px}
.btn:hover{filter:brightness(.92)}
.btn.lg{height:48px;padding:0 22px;font-size:15px}
.btn.sec{background:var(--surface);color:var(--primary)}
.btn.ok{background:#059669;border-color:#059669}
.btn.icon{background:transparent;border-color:var(--border);color:var(--ink);width:40px;padding:0}
@media(max-width:760px){.links{display:none}nav.top .btn.sec{display:none}nav.top .btn.icon{margin-left:auto}}
/* HERO */
#hero{height:340vh;position:relative}
.stage{position:sticky;top:64px;height:calc(100vh - 64px);height:calc(100svh - 64px);display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:48px;align-items:center;padding-bottom:16px}
.copy p.lead{margin-top:16px;color:var(--mute);max-width:46ch;font-size:17px;line-height:26px}
.cta{display:flex;gap:12px;margin-top:24px;flex-wrap:wrap}
ol.steps{list-style:none;margin:32px 0 0;padding:0;display:grid;gap:4px;counter-reset:s}
ol.steps li{counter-increment:s;display:flex;gap:12px;align-items:flex-start;padding:8px 12px;border-radius:8px;color:var(--mute);font-size:14px;line-height:20px;border-left:3px solid var(--border);transition:background .2s,color .2s,border-color .2s}
ol.steps li.on{background:var(--tint);color:var(--ink);border-left-color:var(--primary);font-weight:500}
ol.steps li::before{content:counter(s);font:500 12px var(--mono);color:var(--primary);padding-top:1px}
.board{background:var(--surface);border:1px solid var(--border);border-radius:16px;box-shadow:0 12px 32px rgba(0,0,0,.14);padding:12px 12px 14px;position:relative;min-width:0}
.bar{display:flex;align-items:center;gap:8px;padding:2px 4px 10px;font-size:13px;flex-wrap:wrap}
.bar b{font-weight:600}
.chip{margin-left:auto;display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:600;font-variant-numeric:tabular-nums;border:1px solid currentColor;color:var(--err);background:color-mix(in srgb,var(--err) 10%,transparent);transition:color .2s}
.chip.good{color:var(--ok);background:color-mix(in srgb,var(--ok) 10%,transparent)}
.days{display:grid;grid-template-columns:repeat(5,1fr);gap:0;font-size:12px;color:var(--mute);font-weight:500;margin-bottom:6px}
.days span{padding:0 6px}
.grid{position:relative;width:100%;aspect-ratio:5/4.2;background:repeating-linear-gradient(0deg,transparent 0 calc(25% - 1px),var(--border) calc(25% - 1px) 25%),repeating-linear-gradient(90deg,transparent 0 calc(20% - 1px),var(--border) calc(20% - 1px) 20%);border-radius:8px}
.blk{position:absolute;padding:3px;will-change:transform}
.blk>div{height:100%;border-left:4px solid var(--c);background:color-mix(in srgb,var(--c) 13%,var(--surface));border-radius:6px;padding:5px 7px;overflow:hidden;font-size:11px;line-height:14px;color:var(--ink);box-shadow:0 0 0 1px transparent;transition:box-shadow .2s,background .3s,border-color .3s}
.blk b{display:block;font-size:12.5px;line-height:16px;font-weight:600;white-space:nowrap;text-overflow:ellipsis;overflow:hidden}
.blk span{display:block;color:var(--mute);white-space:nowrap;text-overflow:ellipsis;overflow:hidden}
.blk.clash>div{box-shadow:0 0 0 2px var(--err)}
.blk .tag{display:none;margin-top:3px;font-weight:600;color:var(--warn);font-size:10.5px;white-space:normal}
.blk.sub>div{--c:#F59E0B;animation:pulse .6s ease-out}
.blk.sub .tag{display:block}
.blk.sub .n{display:none}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(245,158,11,.7)}100%{box-shadow:0 0 0 12px rgba(245,158,11,0)}}
.toast{position:absolute;right:16px;bottom:-14px;background:var(--ink);color:var(--bg);font-size:13px;font-weight:500;padding:10px 14px;border-radius:10px;box-shadow:0 12px 32px rgba(0,0,0,.25);opacity:0;transform:translateY(8px);transition:opacity .2s,transform .2s;max-width:calc(100% - 32px)}
.toast.on{opacity:1;transform:none}
.cue{position:absolute;left:0;bottom:8px;font-size:13px;color:var(--mute);transition:opacity .3s}
@media(max-width:900px){
 .stage{grid-template-columns:1fr;gap:14px;align-content:start;padding-top:16px}
 h1{font-size:30px}.copy p.lead,.steps,.cue{display:none}.cta{margin-top:14px}
 .blk b{font-size:11px}.blk span{display:none}.blk .tag{font-size:9px}
}
/* SECTIONS */
section.s{padding:96px 0}
.head{max-width:60ch;margin-bottom:40px}.head p{margin-top:12px;color:var(--mute);font-size:17px;line-height:26px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:24px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:24px;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.card h3{margin-bottom:4px}.card>p{color:var(--mute);font-size:14px;line-height:20px;margin-bottom:16px}
dl.rules{margin:0;display:grid;gap:0}
dl.rules div{display:grid;grid-template-columns:56px 1fr;gap:12px;padding:12px 0;border-top:1px solid var(--border);font-size:14px;line-height:20px}
dl.rules dt{font:500 12px var(--mono);color:var(--primary);padding-top:2px}
dl.rules dd{margin:0}
.badge{display:inline-flex;align-items:center;gap:6px;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:500;background:color-mix(in srgb,var(--c) 14%,transparent);color:var(--c)}
.badge::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.sub-wrap{display:grid;grid-template-columns:1fr 1fr;gap:48px;align-items:center}
ol.tl{list-style:none;margin:0;padding:0;display:grid;gap:0}
ol.tl li{position:relative;padding:0 0 28px 40px}
ol.tl li:last-child{padding-bottom:0}
ol.tl li::before{content:"";position:absolute;left:11px;top:24px;bottom:0;width:2px;background:var(--border)}
ol.tl li:last-child::before{display:none}
ol.tl li i{position:absolute;left:0;top:0;width:24px;height:24px;border-radius:50%;background:var(--tint);color:var(--primary);display:grid;place-items:center;font:600 12px var(--mono);font-style:normal}
ol.tl h3{font-size:16px;line-height:24px}ol.tl p{font-size:14px;line-height:20px;color:var(--mute)}
.inv{border-left:4px solid #F59E0B}
.inv .row{display:flex;gap:12px;margin-top:16px;flex-wrap:wrap}
.inv .meta{font-size:14px;line-height:22px;color:var(--mute)}
.inv .meta b{color:var(--ink)}
.feed{display:flex;gap:8px;align-items:center;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:6px 6px 6px 12px;font:500 13px var(--mono);margin:16px 0}
.feed span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--mute)}
.feed .btn{height:32px;font-size:13px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:0;border:1px solid var(--border);border-radius:12px;background:var(--surface);overflow:hidden}
.stats div{padding:28px 24px;border-left:1px solid var(--border)}.stats div:first-child{border-left:0}
.stats b{display:block;font-size:40px;line-height:44px;font-weight:700;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.stats span{font-size:14px;line-height:20px;color:var(--mute);display:block;margin-top:6px}
.final{background:var(--primary);color:var(--on-primary);border-radius:16px;padding:56px 32px;text-align:center}
.final p{margin:12px auto 24px;max-width:48ch;opacity:.92}
.final .btn{background:var(--on-primary);color:var(--primary);border-color:var(--on-primary)}
footer{padding:32px 0 48px;border-top:1px solid var(--border);color:var(--mute);font-size:14px}
footer .wrap{display:flex;gap:24px;flex-wrap:wrap;justify-content:space-between}
@media(max-width:900px){.two,.sub-wrap{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}.stats div:nth-child(3){border-left:0}.stats div:nth-child(n+3){border-top:1px solid var(--border)}section.s{padding:64px 0}.wrap{padding:0 16px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>
<script>try{var r=sessionStorage.getItem("sw_role"),d=document.documentElement;if(r){d.classList.add("auth");d.dataset.role=r}}catch(e){}</script>
</head>

<section id="gate" aria-label="Sign in">
 <div class="g-in">
  <svg class="g-mark" width="44" height="44" viewBox="0 0 40 40" aria-hidden="true"><g fill="none" stroke="#b6b095" stroke-width="2.6" stroke-linecap="round"><path id="gp" d="M20 20C22 12 30 8 33 12C35 15 31 17 29 14"/><use href="#gp" transform="rotate(60 20 20)"/><use href="#gp" transform="rotate(120 20 20)"/><use href="#gp" transform="rotate(180 20 20)"/><use href="#gp" transform="rotate(240 20 20)"/><use href="#gp" transform="rotate(300 20 20)"/></g><circle cx="20" cy="20" r="2.6" fill="#e3131b"/></svg>

 </div>
</section>

.board{background:var(--surface);border:1px solid var(--border);border-radius:16px;box-shadow:0 12px 32px rgba(0,0,0,.14);padding:12px 12px 14px;position:relative;min-width:0}

.days{display:grid;grid-template-columns:repeat(5,1fr);gap:0;font-size:12px;color:var(--mute);font-weight:500;margin-bottom:6px}

.grid{position:relative;width:100%;aspect-ratio:5/4.2;background:repeating-linear-gradient(0deg,transparent 0 calc(25% - 1px),var(--border) calc(25% - 1px) 25%),repeating-linear-gradient(90deg,transparent 0 calc(20% - 1px),var(--border) calc(20% - 1px) 20%);border-radius:8px}
.blk{position:absolute;padding:3px;will-change:transform}
.blk&gt;div{height:100%;border-left:4px solid var(--c);background:color-mix(in srgb,var(--c) 13%,var(--surface));border-radius:6px;padding:5px 7px;overflow:hidden;font-size:11px;line-height:14px;color:var(--ink);box-shadow:0 0 0 1px transparent;transition:box-shadow .2s,background .3s,border-color .3s}

lt;/borders&gt;&lt;cellStyleXfs count=&quot;1&quot;&gt;&lt;xf numFmtId=&quot;0&quot; fontId=&quot;0&quot; fillId=&quot;0&quot; borderId=&quot;0&quot;/&gt;&lt;/cellStyleXfs&gt;&lt;cellXfs count=&quot;8&quot;&gt;&lt;xf numFmtId=&quot;0&quot; fontId=&quot;0&quot; fillId=&quot;0&quot; borderId=&quot;0&quot; xfId=&quot;0&quot;/&gt;&lt;xf numFmtId=&quot;0&quot; fontId=&quot;1&quot; fillId=&quot;2&quot; borderId=&quot;1&quot; xfId=&quot;0&quot; applyFont=&quot;1&quot; applyFill=&quot;1&quot; applyBorder=&quot;1&quot; applyAlignment=&quot;1&quot;&gt;&lt;alignment horizontal=&quot;center&quot; vertical=&quot;center&quot;/&gt;&lt;/xf&gt;&lt;xf numFmtId=&quot;0&quot; fontId=&quot;2&quot; fillId=&quot;0&quot; borderId=&quot;1&quot; xfId=&quot;0&quot; applyFont=&quot;1&quot; applyBorder=&quot;1&quot; applyAlignment=&quot;1&quot;&gt;&lt;alignment horizontal=&quot;center&quot; vertical=&quot;center&quot;/&gt;&lt;/xf&gt;&lt;xf numFmtId=&quot;0&quot; fontId=&quot;0&quot; fillId=&quot;0&quot; borderId=&quot;1&quot; xfId=&quot;0&quot; applyBorder=&quot;1&quot; applyAlignment=&quot;1&quot;&gt;&lt;alignment vertical=&quot;top&quot; wrapText=&quot;1&quot;/&gt;&lt;/xf&gt;&lt;xf numFmtId=&quot;0&quot; fontId=&quot;3&quot; fillId=&quot;5&quot; borderId=&quot;1&quot; xfId=&quot;0&quot; applyFont=&quot;1&quot; applyFill=&quot;1&quot; applyBorder=&quot;1&quot; applyAlignment=&quot;1&quot;&gt;&lt;alignment horizontal=&quot;center&quot; vertical=&quot;center&quot;/&gt;&lt;/xf&gt;&lt;xf numFmtId=&quot;0&quot; fontId=&quot;0&quot; fillId=&quot;0&quot; borderId=&quot;1&quot; xfId=&quot;0&quot; applyBorder=&quot;1&quot;/&gt;&lt;xf numFmtId=&quot;0&quot; fontId=&quot;0&quot; fillId=&quot;3&quot; borderId=&quot;1&quot; xfId=&quot;0&quot; applyFill=&quot;1&quot; applyBorder=&quot;1&quot; applyAlignment=&quot;1&quot;&gt;&lt;alignment vertical=&quot;top&quot; wrapText=&quot;1&quot;/&gt;&lt;/xf&gt;&lt;xf numFmtId=&quot;0&quot; fontId=&quot;0&quot; fillId=&quot;4&quot; borderId=&quot;1&quot; xfId=&quot;0&quot; applyFill=&quot;1&quot; applyBorder=&quot;1&quot; applyAlignment=&quot;1&quot;&gt;&lt;alignment vertical=&quot;top&quot; wrapText=&quot;1&quot;/&gt;&lt;/xf&gt;&lt;/cellXfs&gt;&lt;cellStyles count=&quot;1&quot;&gt;&lt;cellStyle name=&quot;Normal&quot; xfId=&quot;0&quot; builtinId=&quot;0&quot;/&gt;&lt;/cellStyles&gt;&lt;/styleSheet&gt;&#x27;;

 const files=[
  [&#x27;[Content_Types].xml&#x27;,hd+&#x27;&lt;Types xmlns=&quot;http://schemas.openxmlformats.org/package/2006/content-types&quot;&gt;&lt;Default Extension=&quot;rels&quot; ContentType=&quot;application/vnd.openxmlformats-package.relationships+xml&quot;/&gt;&lt;Default Extension=&quot;xml&quot; ContentType=&quot;application/xml&quot;/&gt;&lt;Override PartName=&quot;/xl/workbook.xml&quot; ContentType=&quot;application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml&quot;/&gt;&lt;Override PartName=&quot;/xl/styles.xml&quot; ContentType=&quot;application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml&quot;/&gt;&#x27;+sheets.map((s,i)=&gt;&#x27;&lt;Override PartName=&quot;/xl/worksheets/sheet&#x27;+(i+1)+&#x27;.xml&quot; ContentType=&quot;application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml&quot;/&gt;&#x27;).join(&#x27;&#x27;)+&#x27;&lt;/Types&gt;&#x27;],
  [&#x27;_rels/.rels&#x27;,hd+&#x27;&lt;Relationships xmlns=&quot;http://schemas.openxmlformats.org/package/2006/relationships&quot;&gt;&lt;Relationship Id=&quot;rId1&quot; Type=&quot;&#x27;+rn+&#x27;/officeDocument&quot; Target=&quot;xl/workbook.xml&quot;/&gt;&lt;/Relationships&gt;&#x27;],
  [&#x27;xl/workbook.xml&#x27;,hd+&#x27;&lt;workbook &#x27;+ns+&#x27; xmlns:r=&quot;&#x27;+rn+&#x27;&quot;&gt;&lt;sheets&gt;&#x27;+sheets.map((s,i)=&gt;&#x27;&lt;sheet name=&quot;&#x27;+xe(s[0])+&#x27;&quot; sheetId=&quot;&#x27;+(i+1)+&#x27;&quot; r:id=&quot;rId&#x27;+(i+1)+&#x27;&quot;/&gt;&#x27;).join(&#x27;&#x27;)+&#x27;&lt;/sheets&gt;&lt;/workbook&gt;&#x27;],
  [&#x27;xl/_rels/workbook.xml.rels&#x27;,hd+&#x27;&lt;Relationships xmlns=&quot;http://schemas.openxmlformats.org/package/2006/relationships&quot;&gt;&#x27;+sheets.map((s,i)=&gt;&#x27;&lt;Relationship Id=&quot;rId&#x27;+(i+1)+&#x27;&quot; Type=&quot;&#x27;+rn+&#x27;/worksheet&quot; Target=&quot;worksheets/sheet&#x27;+(i+1)+&#x27;.xml&quot;/&gt;&#x27;).join(&#x27;&#x27;)+&#x27;&lt;Relationship Id=&quot;rId&#x27;+(n+1)+&#x27;&quot; Type=&quot;&#x27;+rn+&#x27;/styles&quot; Target=&quot;styles.xml&quot;/&gt;&lt;/Relationships&gt;&#x27;],

&lt;script&gt;
/* ===== SlotWise live backend + missing dashboard features =====
   This layer only adds functionality; existing animation/generator scripts remain untouched.
*/
(function(){
  const API=&quot;http://127.0.0.1:8000&quot;;
  const ROLE=(window.parent&amp;&amp;window.parent.document&amp;&amp;window.parent.document.documentElement.dataset.role)||document.documentElement.dataset.role;
  const root=document.getElementById(&quot;ptl&quot;);

  const api=async(path,opts)=&gt;{
    const res=await fetch(API+path,Object.assign({headers:{&quot;Content-Type&quot;:&quot;application/json&quot;}},opts||{}));
    const text=await res.text();let data=null;try{data=text?JSON.parse(text):null}catch(e){data=text}
    if(!res.ok)throw new Error((data&amp;&amp;data.detail)||&quot;Backend request failed (&quot;+res.status+&quot;)&quot;);
    return data;
  };
  const user=()=&gt;{
    try{return parent.__SW_PARENT_USER||JSON.parse(parent.sessionStorage.getItem(&quot;sw_user&quot;)||&quot;null&quot;)}catch(e){return null}
  };
  const clone=x=&gt;JSON.parse(JSON.stringify(x));
  const slug=s=&gt;String(s||&quot;&quot;).toLowerCase().replace(/[^a-z0-9]+/g,&quot;_&quot;).replace(/^_|_$/g,&quot;&quot;);
  const subjectKey=n=&gt;{
    const m={&quot;Data Structures&quot;:&quot;DS&quot;,&quot;Database Systems&quot;:&quot;DBMS&quot;,&quot;Operating Systems&quot;:&quot;OS&quot;,&quot;Computer Networks&quot;:&quot;CN&quot;,&quot;Discrete Mathematics&quot;:&quot;MA&quot;,&quot;Discrete Maths&quot;:&quot;MA&quot;,&quot;DBMS Lab&quot;:&quot;DBL&quot;,&quot;OS Lab&quot;:&quot;OSL&quot;};
    return m[n]||(&quot;S_&quot;+slug(n).slice(0,18));
  };
  const facultyKey=n=&gt;{
    const m={&quot;Dr. Rao&quot;:&quot;rao&quot;,&quot;Dr. Iyer&quot;:&quot;iyer&quot;,&quot;Prof. Nair&quot;:&quot;nair&quot;,&quot;Dr. Sen&quot;:&quot;sen&quot;,&quot;Dr. Bose&quot;:&quot;bose&quot;,&quot;Prof. Bose&quot;:&quot;bose&quot;,&quot;Prof. Mehta&quot;:&quot;mehta&quot;};
    return m[n]||(&quot;f_&quot;+slug(n).slice(0,18));
  };
  const batchKey=n=&gt;String(n||&quot;&quot;).replace(/^CSE-/i,&quot;&quot;);
  const dayKey=n=&gt;({Monday:0,Tuesday:1,Wednesday:2,Thursday:3,Friday:4,Mon:0,Tue:1,Wed:2,Thu:3,Fri:4}[n]);
  const state=()=&gt;{try{return window.__swx&amp;&amp;window.__swx()}catch(e){return null}};
  const saveState=s=&gt;{
    const raw=JSON.stringify(s);
    try{localStorage.setItem(&quot;sw_state_v1&quot;,raw);window.dispatchEvent(new Event(&quot;storage&quot;))}catch(e){}
  };

  function ensureModels(meta){
    const x=state();if(!x)return;
    const {SB,T,BZ}=x;
    (meta.subjects||[]).forEach(s=&gt;{
      const k=subjectKey(s.name);
      if(!SB[k])SB[k]={n:s.name,k:1,t:&quot;&quot;,c:&quot;var(--s5)&quot;,lab:s.is_practical?1:0};
      else {SB[k].n=s.name;SB[k].lab=s.is_practical?1:0}
    });
    (meta.faculty||[]).forEach(f=&gt;{
      const k=facultyKey(f.name);
      if(!T[k])T[k]={n:f.name,s:[]};else T[k].n=f.name;
    });
    (meta.batches||[]).forEach(b=&gt;{
      const k=batchKey(b.name);
      if(!(k in BZ))BZ[k]=60;
    });
    (meta.mappings||[]).forEach(m=&gt;{
      const f=meta.faculty.find(z=&gt;z.id===m.faculty_id),s=meta.subjects.find(z=&gt;z.id===m.subject_id);
      if(!f||!s)return;
      const fk=facultyKey(f.name),sk=subjectKey(s.name);
      T[fk]=T[fk]||{n:f.name,s:[]};
      if(!T[fk].s.includes(sk))T[fk].s.push(sk);
      if(SB[sk]&amp;&amp;!SB[sk].t)SB[sk].t=fk;
    });
  }

  function convertEntries(entries,meta){
    const x=state();if(!x)return [];
    const {SB,T,BZ,D,P}=x;
    const facultyById=new Map((meta.faculty||[]).map(v=&gt;[v.id,v]));
    const subjectById=new Map((meta.subjects||[]).map(v=&gt;[v.id,v]));
    const batchById=new Map((meta.batches||[]).map(v=&gt;[v.id,v]));
    const roomById=new Map((meta.rooms||[]).map(v=&gt;[v.id,v]));
    const slotById=new Map((meta.slots||[]).map(v=&gt;[v.id,v]));
    return (entries||[]).map(e=&gt;{
      const subj=subjectById.get(e.subject_id)||{name:e.subject||&quot;Subject&quot;,is_practical:!!e.is_practical};
      const fac=facultyById.get(e.faculty_id)||{name:e.faculty||&quot;Faculty&quot;};
      const bat=batchById.get(e.batch_id)||{name:e.batch||&quot;Batch&quot;};
      const room=roomById.get(e.room_id)||{room_number:e.room||&quot;Room&quot;};
      const slot=slotById.get(e.time_slot_id);
      const day=slot?dayKey(slot.day):dayKey(e.day);
      const p=slot?P.findIndex(v=&gt;v===slot.start_time):P.findIndex(v=&gt;v===e.start_time);
      const sk=subjectKey(subj.name),fk=facultyKey(fac.name),bk=batchKey(bat.name);
      if(!SB[sk])SB[sk]={n:subj.name,k:1,t:fk,c:&quot;var(--s5)&quot;,lab:subj.is_practical?1:0};
      if(!T[fk])T[fk]={n:fac.name,s:[sk]};else if(!T[fk].s.includes(sk))T[fk].s.push(sk);
      if(!(bk in BZ))BZ[bk]=60;
      return {b:bk,d:day,p:Math.max(0,p),s:sk,t:fk,r:room.room_number||e.room||&quot;Room&quot;,sub:null,st:null,apiId:e.id,apiFacultyId:e.faculty_id,apiSubjectId:e.subject_id,apiBatchId:e.batch_id,apiTimeSlotId:e.time_slot_id};
    }).filter(e=&gt;e.d!=null&amp;&amp;e.p&gt;=0);
  }

  async function syncBackend(){
    const u=user(); if(!u)return;
    try{
      const meta=await api(&quot;/dashboard/summary&quot;);
      const {faculty,subjects,batches,rooms,slots,mappings,entries:allEntries}=meta;
      ensureModels({faculty,subjects,batches,rooms,slots,mappings});
      let entries=allEntries;
      if(ROLE===&quot;faculty&quot;&amp;&amp;u.faculty_id) entries=allEntries.filter(e=&gt;e.faculty_id===u.faculty_id);
      if(ROLE===&quot;student&quot;&amp;&amp;u.batch_id) entries=allEntries.filter(e=&gt;e.batch_id===u.batch_id);
      const x=state();if(!x)return;
      const E=convertEntries(entries,{faculty,subjects,batches,rooms,slots,mappings});
      x.S.pub=x.S.pub||{E:[],ver:1,at:Date.now()};
      x.S.pub.E=E;x.S.draft=clone(E);
      x.S.pub.at=Date.now();
      saveState(x.S);
      window.dispatchEvent(new Event(&quot;sw-backend-synced&quot;));
      if(typeof window.__swxBackendStatus===&quot;function&quot;)window.__swxBackendStatus(&quot;Connected · &quot;+E.length+&quot; timetable entries&quot;);
      mountEnhancements();
    }catch(e){
      if(typeof window.__swxBackendStatus===&quot;function&quot;)window.__swxBackendStatus(&quot;Backend sync failed: &quot;+e.message);
    }
  }

  async function backendGenerate(){
    if(ROLE!==&quot;admin&quot;)return;
    if(typeof window.__swxBackendStatus===&quot;function&quot;)window.__swxBackendStatus(&quot;Generating timetable from PostgreSQL…&quot;);
    try{
      const r=await api(&quot;/timetable/generate&quot;,{method:&quot;POST&quot;});
      await syncBackend();
      if(typeof window.__swxBackendStatus===&quot;function&quot;)window.__swxBackendStatus(r.message||&quot;Timetable generated from backend.&quot;);
      setTimeout(refreshAdminDashboard,250);
    }catch(e){
      if(typeof window.__swxBackendStatus===&quot;function&quot;)window.__swxBackendStatus(&quot;Backend generation failed: &quot;+e.message);
      alert(&quot;Backend timetable generation failed:\n&quot;+e.message);
    }
  }

  function getVersions(){
    try{return JSON.parse(sessionStorage.getItem(&quot;sw_versions_v1&quot;)||&quot;[]&quot;)}catch(e){return []}
  }
  function putVersions(v){
    try{sessionStorage.setItem(&quot;sw_versions_v1&quot;,JSON.stringify(v.slice(-8)))}catch(e){}
  }
  function recordVersion(){
    const x=state();if(!x||!x.S||!x.S.pub)return;
    const v=getVersions(), snap={ver:x.S.pub.ver,at:x.S.pub.at,E:clone(x.S.pub.E)};
    if(v.length&amp;&amp;v[v.length-1].ver===snap.ver)return;
    v.push(snap);putVersions(v);refreshAdminDashboard();
  }
  function rollbackVersion(ver){
    const v=getVersions().find(z=&gt;String(z.ver)===String(ver));if(!v)return;
    const x=state();if(!x)return;
    x.S.pub={E:clone(v.E),ver:v.ver,at:Date.now()};
    x.S.draft=clone(v.E);
    saveState(x.S);refreshAdminDashboard();
  }

  async function adminDashboardData(){
    return await api(&quot;/dashboard/summary&quot;);
  }

  async function refreshAdminDashboard(){
    if(ROLE!==&quot;admin&quot;||!document.getElementById(&quot;swx-admin&quot;))return;
    const body=document.getElementById(&quot;swx-admin-body&quot;);if(!body)return;
    try{
      const d=await adminDashboardData(),v=getVersions();
      const iss=d.issues.slice(0,8);
      body.innerHTML=
        &#x27;&lt;div class=&quot;swx-stat&quot;&gt;&lt;b&gt;&#x27;+d.entries.length+&#x27;&lt;/b&gt;&lt;span&gt;Scheduled classes&lt;/span&gt;&lt;/div&gt;&#x27;+
        &#x27;&lt;div class=&quot;swx-stat&quot;&gt;&lt;b&gt;&#x27;+d.faculty.length+&#x27;&lt;/b&gt;&lt;span&gt;Faculty&lt;/span&gt;&lt;/div&gt;&#x27;+
        &#x27;&lt;div class=&quot;swx-stat&quot;&gt;&lt;b&gt;&#x27;+d.rooms.length+&#x27;&lt;/b&gt;&lt;span&gt;Rooms&lt;/span&gt;&lt;/div&gt;&#x27;+
        &#x27;&lt;div class=&quot;swx-stat&quot;&gt;&lt;b&gt;&#x27;+d.batches.length+&#x27;&lt;/b&gt;&lt;span&gt;Batches&lt;/span&gt;&lt;/div&gt;&#x27;+
        &#x27;&lt;div class=&quot;swx-line&quot;&gt;&lt;b&gt;Room utilisation&lt;/b&gt;&lt;span&gt;&#x27;+d.occupancy+&#x27;%&lt;/span&gt;&lt;/div&gt;&#x27;+
        &#x27;&lt;div class=&quot;swx-line&quot;&gt;&lt;b&gt;Highest faculty load&lt;/b&gt;&lt;span&gt;&#x27;+ (d.maxFaculty||&quot;—&quot;)+&#x27; · &#x27;+d.maxLoad+&#x27;&lt;/span&gt;&lt;/div&gt;&#x27;+
        &#x27;&lt;details class=&quot;swx-detail&quot;&gt;&lt;summary&gt;Live conflict report · &#x27;+d.issues.length+&#x27;&lt;/summary&gt;&lt;div class=&quot;swx-small&quot;&gt;&#x27;+
          (iss.length?iss.map(x=&gt;&#x27;• &#x27;+x).join(&#x27;&lt;br&gt;&#x27;):&#x27;✓ No current faculty/room/batch mapping conflicts detected.&#x27;)+
          (d.issues.length&gt;8?&#x27;&lt;br&gt;…and &#x27;+(d.issues.length-8)+&#x27; more&#x27;:&#x27;&#x27;)+
        &#x27;&lt;/div&gt;&lt;/details&gt;&#x27;+

          &#x27;&lt;button class=&quot;btn sec swx-action&quot; data-swx=&quot;add-subject&quot;&gt;Add subject&lt;/button&gt;&#x27;+
          &#x27;&lt;button class=&quot;btn sec swx-action&quot; data-swx=&quot;add-room&quot;&gt;Add room&lt;/button&gt;&#x27;+
          &#x27;&lt;button class=&quot;btn sec swx-action&quot; data-swx=&quot;add-batch&quot;&gt;Add batch&lt;/button&gt;&#x27;+
          &#x27;&lt;button class=&quot;btn swx-action&quot; data-swx=&quot;seed&quot;&gt;Load demo data&lt;/button&gt;&#x27;+

          (v.length?&#x27;&lt;select id=&quot;swx-version-select&quot;&gt;&#x27;+v.slice().reverse().map(z=&gt;&#x27;&lt;option value=&quot;&#x27;+z.ver+&#x27;&quot;&gt;Published v&#x27;+z.ver+&#x27; · &#x27;+new Date(z.at).toLocaleString()+&#x27;&lt;/option&gt;&#x27;).join(&quot;&quot;)+&#x27;&lt;/select&gt;&#x27;+
          &#x27;&lt;button class=&quot;btn sec swx-action&quot; data-swx=&quot;rollback&quot;&gt;Rollback selected&lt;/button&gt;&#x27;:&#x27;&lt;span class=&quot;swx-small&quot;&gt;No local versions recorded yet.&lt;/span&gt;&#x27;)+
        &#x27;&lt;/div&gt;&#x27;;
    }catch(e){
      body.innerHTML=&#x27;&lt;div class=&quot;swx-small&quot;&gt;Dashboard unavailable: &#x27;+e.message+&#x27;&lt;/div&gt;&#x27;;
    }
  }

  async function addFaculty(){
    const name=prompt(&quot;Faculty name&quot;);if(!name)return;
    const max=parseInt(prompt(&quot;Maximum daily lectures&quot;,&quot;4&quot;)||&quot;4&quot;,10);
    await api(&quot;/faculty/&quot;,{method:&quot;POST&quot;,body:JSON.stringify({name,max_daily_lectures:Number.isFinite(max)?max:4})});
    await syncBackend();refreshAdminDashboard();
  }
  async function addSubject(){
    const name=prompt(&quot;Subject name&quot;);if(!name)return;
    const practical=confirm(&quot;Is this a laboratory/practical subject?&quot;);
    await api(&quot;/subjects/&quot;,{method:&quot;POST&quot;,body:JSON.stringify({name,is_practical:practical})});
    await syncBackend();refreshAdminDashboard();
  }
  async function addRoom(){
    const room_number=prompt(&quot;Room number/name&quot;);if(!room_number)return;
    const lab=confirm(&quot;Is this a lab room?&quot;);
    await api(&quot;/rooms/&quot;,{method:&quot;POST&quot;,body:JSON.stringify({room_number,is_lab:lab})});
    await syncBackend();refreshAdminDashboard();
  }
  async function addBatch(){
    const name=prompt(&quot;Batch name (example: CSE-3C)&quot;);if(!name)return;
    await api(&quot;/batches/&quot;,{method:&quot;POST&quot;,body:JSON.stringify({name})});
    await syncBackend();refreshAdminDashboard();
  }
  async function seed(){
    await api(&quot;/demo/seed&quot;,{method:&quot;POST&quot;});await syncBackend();refreshAdminDashboard();
  }

  async function backendCalendar(){
    const u=user();if(!u)return;
    const url=API+&quot;/calendar/&quot;+u.id+&quot;.ics&quot;;
    window.open(url,&quot;_blank&quot;,&quot;noopener&quot;);
  }

  async function notificationData(){
    const u=user();if(!u)return [];
    try{return await api(&quot;/notifications/user/&quot;+u.id)}catch(e){return []}
  }

  async function leaveToBackend(localReq){
    const u=user();if(!u||ROLE!==&quot;faculty&quot;)return;
    const x=state();if(!x)return;
    const e=x.S.pub.E.find(z=&gt;z.b===localReq.b&amp;&amp;z.d===localReq.d&amp;&amp;z.p===localReq.p&amp;&amp;z.s===localReq.s);
    if(!e||!e.apiId)return;
    const reason=prompt(&quot;Why can&#x27;t you attend this class?&quot;,&quot;Faculty leave / unavailable&quot;);if(reason===null)return;
    try{
      const [faculties,mappings,allEntries]=await Promise.all([api(&quot;/faculty/&quot;),api(&quot;/faculty-subjects/&quot;),api(&quot;/timetable/&quot;)]);
      const subjectId=e.apiSubjectId;
      const candidates=faculties.filter(f=&gt;f.id!==u.faculty_id&amp;&amp;mappings.some(m=&gt;m.faculty_id===f.id&amp;&amp;m.subject_id===subjectId));
      const daySlotEntries=allEntries.filter(z=&gt;z.time_slot_id===e.apiTimeSlotId);
      const daily={};
      allEntries.forEach(z=&gt;{
        if(z.faculty_id!==e.apiFacultyId)return;
        daily[z.time_slot_id]=(daily[z.time_slot_id]||0)+1;
      });
      const chosen=candidates.find(f=&gt;!daySlotEntries.some(z=&gt;z.faculty_id===f.id)&amp;&amp;daily[e.apiTimeSlotId]!==undefined?true:true);
      const body={timetable_entry_id:e.apiId,original_faculty_id:u.faculty_id,substitute_faculty_id:chosen?chosen.id:null,reason,status:&quot;PENDING&quot;};
      const created=await api(&quot;/substitution-requests/&quot;,{method:&quot;POST&quot;,body:JSON.stringify(body)});
      const key=e.t+&quot;|&quot;+e.b+&quot;|&quot;+e.d+&quot;|&quot;+e.p;
      const x2=state();
      const r=x2?.S?.req?.find(q=&gt;q.from===e.t&amp;&amp;q.b===e.b&amp;&amp;q.d===e.d&amp;&amp;q.p===e.p);
      if(r){r.apiId=created.id;r.apiCandidateId=chosen?chosen.id:null;r.reason=reason;saveState(x2.S)}
    }catch(err){
      alert(&quot;Leave request could not be sent to the backend:\n&quot;+err.message);
    }
  }

  async function respondBackend(localId,accepted){
    const x=state();if(!x)return;
    const r=x.S.req.find(q=&gt;q.id===localId);if(!r||!r.apiId)return;
    let reason=null;if(!accepted){reason=prompt(&quot;Reason for declining the class request&quot;,&quot;Not available at that time&quot;);if(reason===null)return}
    try{
      await api(&quot;/substitution-requests/&quot;+r.apiId+&quot;/respond?accepted=&quot;+(accepted?&quot;true&quot;:&quot;false&quot;)+(reason?(&quot;&amp;reason=&quot;+encodeURIComponent(reason)):&quot;&quot;),{method:&quot;POST&quot;});
      if(!accepted&amp;&amp;r.c&amp;&amp;r.c[r.i]){
        const candKey=Object.keys(x.T||{}).find(k=&gt;k===r.c[r.i]);
        const facId=user()?.faculty_id||null;
        /* Next candidate creation is handled by the local cascade; backend gets the current response above. */
      }
      await syncBackend();
    }catch(err){alert(&quot;Backend response failed:\n&quot;+err.message)}
  }

  function notificationsCard(list){
    return &#x27;&lt;div class=&quot;card swx-notify&quot;&gt;&lt;div class=&quot;swx-nhead&quot;&gt;&lt;h3&gt;Notifications&lt;/h3&gt;&lt;span class=&quot;badge&quot; style=&quot;--c:var(--info)&quot;&gt;&#x27;+list.filter(x=&gt;!x.is_read).length+&#x27; unread&lt;/span&gt;&lt;/div&gt;&#x27;+
      (list.length?&#x27;&lt;ul class=&quot;pt-l&quot;&gt;&#x27;+list.slice().reverse().slice(0,5).map(n=&gt;&#x27;&lt;li&gt;&lt;b&gt;&#x27;+String(n.message||&quot;Notification&quot;).replace(/&lt;/g,&quot;&amp;lt;&quot;)+&#x27;&lt;/b&gt;&lt;br&gt;&lt;span class=&quot;mute&quot;&gt;&#x27;+(n.is_read?&quot;Read&quot;:&quot;New&quot;)+&#x27;&lt;/span&gt;&lt;/li&gt;&#x27;).join(&quot;&quot;)+&#x27;&lt;/ul&gt;&#x27;:&#x27;&lt;p style=&quot;margin:0&quot;&gt;No backend notifications yet.&lt;/p&gt;&#x27;)+
      &#x27;&lt;/div&gt;&#x27;;
  }

  async function addNotifications(){
    if(!root)return;
    const holder=document.getElementById(&quot;swx-notify-holder&quot;);if(!holder)return;
    const list=await notificationData();
    holder.innerHTML=notificationsCard(list);
  }

  function mountEnhancements(){
    if(!root)return;
    if(ROLE===&quot;admin&quot;&amp;&amp;!document.getElementById(&quot;swx-admin&quot;)){
      root.insertAdjacentHTML(&quot;beforeend&quot;,
        &#x27;&lt;div class=&quot;card swx-panel&quot; id=&quot;swx-admin&quot;&gt;&lt;div class=&quot;swx-panel-head&quot;&gt;&lt;div&gt;&lt;h3&gt;Live control center&lt;/h3&gt;&lt;p class=&quot;mute&quot;&gt;Connected to FastAPI + Supabase PostgreSQL&lt;/p&gt;&lt;/div&gt;&lt;span id=&quot;swx-backend-status&quot; class=&quot;badge&quot; style=&quot;--c:var(--ok)&quot;&gt;Backend ready&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;swx-grid&quot; id=&quot;swx-admin-body&quot;&gt;&lt;/div&gt;&lt;/div&gt;&#x27;);
      refreshAdminDashboard();
    }
    if(ROLE!==&quot;admin&quot;&amp;&amp;!document.getElementById(&quot;swx-notify-holder&quot;)){
      root.insertAdjacentHTML(&quot;beforeend&quot;,&#x27;&lt;div id=&quot;swx-notify-holder&quot;&gt;&lt;/div&gt;&#x27;);
      addNotifications();
    }
    if(!document.getElementById(&quot;swx-calendar-backend&quot;)){
      root.insertAdjacentHTML(&quot;beforeend&quot;,
        &#x27;&lt;div class=&quot;card swx-panel&quot; id=&quot;swx-calendar-backend&quot;&gt;&lt;div class=&quot;swx-panel-head&quot;&gt;&lt;div&gt;&lt;h3&gt;Backend calendar &amp; data&lt;/h3&gt;&lt;p class=&quot;mute&quot;&gt;Use the real timetable stored in Supabase.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;swx-actions&quot;&gt;&lt;button class=&quot;btn swx-action&quot; data-swx=&quot;backend-calendar&quot;&gt;Open backend .ics&lt;/button&gt;&lt;button class=&quot;btn sec swx-action&quot; data-swx=&quot;refresh-backend&quot;&gt;Refresh data&lt;/button&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;swx-small&quot;&gt;The existing SlotWise animations and local editor stay unchanged.&lt;/div&gt;&lt;/div&gt;&#x27;);
    }
  }

  window.PP_refreshBackend=syncBackend;
  window.__swxBackendStatus=function(message){
    const el=document.getElementById(&quot;swx-backend-status&quot;);if(el)el.textContent=message;
  };

  if(root){
    const observer=new MutationObserver(()=&gt;{mountEnhancements()});
    observer.observe(root,{childList:true,subtree:false});
    setTimeout(()=&gt;mountEnhancements(),120);

    /* Keep the original root handler/animations. Only intercept our newly-added controls. */
    root.addEventListener(&quot;click&quot;,async ev=&gt;{
      const t=ev.target.closest(&quot;.swx-action&quot;);
      if(t){
        ev.stopImmediatePropagation();
        const action=t.dataset.swx;
        try{
          if(action===&quot;add-faculty&quot;)await addFaculty();
          else if(action===&quot;add-subject&quot;)await addSubject();
          else if(action===&quot;add-room&quot;)await addRoom();
          else if(action===&quot;add-batch&quot;)await addBatch();
          else if(action===&quot;seed&quot;)await seed();
          else if(action===&quot;backend-calendar&quot;)await backendCalendar();
          else if(action===&quot;refresh-backend&quot;)await syncBackend();
          else if(action===&quot;rollback&quot;){const s=document.getElementById(&quot;swx-version-select&quot;);if(s)rollbackVersion(s.value)}
        }catch(e){alert(e.message||&quot;Action failed&quot;)}
        return;
      }
      const k=t||ev.target.closest(&quot;button&quot;);
      if(!k)return;
      if(k.id===&quot;p-gen&quot;&amp;&amp;ROLE===&quot;admin&quot;){setTimeout(()=&gt;{if(window.parent&amp;&amp;typeof window.parent.PP_openTimetableConfig===&quot;function&quot;)window.parent.PP_openTimetableConfig();else backendGenerate()},80)}
      if(k.id===&quot;p-pub&quot;&amp;&amp;ROLE===&quot;admin&quot;){setTimeout(recordVersion,80)}
      if(k.dataset&amp;&amp;k.dataset.k&amp;&amp;ROLE===&quot;faculty&quot;){
        const parts=k.dataset.k.split(&quot;,&quot;);
        const x=state();
        const lr=x&amp;&amp;x.S.req.find(q=&gt;String(q.b)===String(parts[0])&amp;&amp;String(q.d)===String(parts[1])&amp;&amp;String(q.p)===String(parts[2]));
        if(lr)setTimeout(()=&gt;leaveToBackend(lr),60);
      }
      if(k.dataset&amp;&amp;k.dataset.y&amp;&amp;ROLE===&quot;faculty&quot;){setTimeout(()=&gt;respondBackend(+k.dataset.y,true),60)}
      if(k.dataset&amp;&amp;k.dataset.n&amp;&amp;ROLE===&quot;faculty&quot;){setTimeout(()=&gt;respondBackend(+k.dataset.n,false),60)}
    },false);

    addEventListener(&quot;sw-login&quot;,()=&gt;setTimeout(()=&gt;{syncBackend().catch(()=&gt;{});mountEnhancements()},80));

    /* Auto-refresh backend dashboard/data every 30 seconds. */
    setInterval(()=&gt;{if(document.visibilityState!==&quot;hidden&quot;)syncBackend().catch(()=&gt;{})},30000);
  }
})();
&lt;/script&gt;

(function(){
  const API=&quot;http://127.0.0.1:8000&quot;;
  const ROLE=(window.parent&&window.parent.document&&window.parent.document.documentElement.dataset.role)||document.documentElement.dataset.role;
  const root=document.getElementById(&quot;ptl&quot;);

  const api=async(path,opts)=&gt;{
    const res=await fetch(API+path,Object.assign({headers:{&quot;Content-Type&quot;:&quot;application/json&quot;}},opts||{}));
    const text=await res.text();let data=null;try{data=text?JSON.parse(text):null}catch(e){data=text}
    if(!res.ok)throw new Error((data&amp;&amp;data.detail)||&quot;Backend request failed (&quot;+res.status+&quot;)&quot;);
    return data;
  };
  const user=()=&gt;{
    try{return parent.__SW_PARENT_USER||JSON.parse(parent.sessionStorage.getItem(&quot;sw_user&quot;)||&quot;null&quot;)}catch(e){return null}
  };
  const clone=x=&gt;JSON.parse(JSON.stringify(x));
  const slug=s=&gt;String(s||&quot;&quot;).toLowerCase().replace(/[^a-z0-9]+/g,&quot;_&quot;).replace(/^_|_$/g,&quot;&quot;);
  const subjectKey=n=&gt;{
    const m={&quot;Data Structures&quot;:&quot;DS&quot;,&quot;Database Systems&quot;:&quot;DBMS&quot;,&quot;Operating Systems&quot;:&quot;OS&quot;,&quot;Computer Networks&quot;:&quot;CN&quot;,&quot;Discrete Mathematics&quot;:&quot;MA&quot;,&quot;Discrete Maths&quot;:&quot;MA&quot;,&quot;DBMS Lab&quot;:&quot;DBL&quot;,&quot;OS Lab&quot;:&quot;OSL&quot;};
    return m[n]||(&quot;S_&quot;+slug(n).slice(0,18));
  };
  const facultyKey=n=&gt;{
    const m={&quot;Dr. Rao&quot;:&quot;rao&quot;,&quot;Dr. Iyer&quot;:&quot;iyer&quot;,&quot;Prof. Nair&quot;:&quot;nair&quot;,&quot;Dr. Sen&quot;:&quot;sen&quot;,&quot;Dr. Bose&quot;:&quot;bose&quot;,&quot;Prof. Bose&quot;:&quot;bose&quot;,&quot;Prof. Mehta&quot;:&quot;mehta&quot;};

    }catch(e){
      if(typeof window.__swxBackendStatus===&quot;function&quot;)window.__swxBackendStatus(&quot;Backend sync failed: &quot;+e.message);
    }
  }

  async function backendGenerate(){
    if(ROLE!==&quot;admin&quot;)return;
    if(typeof window.__swxBackendStatus===&quot;function&quot;)window.__swxBackendStatus(&quot;Generating timetable from PostgreSQL…&quot;);
    try{
      const r=await api(&quot;/timetable/generate&quot;,{method:&quot;POST&quot;});
      await syncBackend();
      if(typeof window.__swxBackendStatus===&quot;function&quot;)window.__swxBackendStatus(r.message||&quot;Timetable generated from backend.&quot;);
      setTimeout(refreshAdminDashboard,250);
    }catch(e){
      if(typeof window.__swxBackendStatus===&quot;function&quot;)window.__swxBackendStatus(&quot;Backend generation failed: &quot;+e.message);
      alert(&quot;Backend timetable generation failed:\n&quot;+e.message);
    }
  }

  function getVersions(){
    try{return JSON.parse(sessionStorage.getItem(&quot;sw_versions_v1&quot;)||&quot;[]&quot;)}catch(e){return []}
  }
  function putVersions(v){
    try{sessionStorage.setItem(&quot;sw_versions_v1&quot;,JSON.stringify(v.slice(-8)))}catch(e){}
  }
  function recordVersion(){
    const x=state();if(!x||!x.S||!x.S.pub)return;
    const v=getVersions(), snap={ver:x.S.pub.ver,at:x.S.pub.at,E:clone(x.S.pub.E)};
    if(v.length&amp;&amp;v[v.length-1].ver===snap.ver)return;
    v.push(snap);putVersions(v);refreshAdminDashboard();
  }
  function rollbackVersion(ver){
    const v=getVersions().find(z=&gt;String(z.ver)===String(ver));if(!v)return;
    const x=state();if(!x)return;
    x.S.pub={E:clone(v.E),ver:v.ver,at:Date.now()};
    x.S.draft=clone(v.E);
    saveState(x.S);refreshAdminDashboard();
  }

  async function adminDashboardData(){
    return await api(&quot;/dashboard/summary&quot;);
  }

  async function refreshAdminDashboard(){
    if(ROLE!==&quot;admin&quot;||!document.getElementById(&quot;swx-admin&quot;))return;
    const body=document.getElementById(&quot;swx-admin-body&quot;);if(!body)return;
    try{
      const d=await adminDashboardData(),v=getVersions();
      const iss=d.issues.slice(0,8);
      body.innerHTML=
        &#x27;&lt;div class=&quot;swx-stat&quot;&gt;&lt;b&gt;&#x27;+d.entries.length+&#x27;&lt;/b&gt;&lt;span&gt;Scheduled classes&lt;/span&gt;&lt;/div&gt;&#x27;+
        &#x27;&lt;div class=&quot;swx-stat&quot;&gt;&lt;b&gt;&#x27;+d.faculty.length+&#x27;&lt;/b&gt;&lt;span&gt;Faculty&lt;/span&gt;&lt;/div&gt;&#x27;+
        &#x27;&lt;div class=&quot;swx-stat&quot;&gt;&lt;b&gt;&#x27;+d.rooms.length+&#x27;&lt;/b&gt;&lt;span&gt;Rooms&lt;/span&gt;&lt;/div&gt;&#x27;+
        &#x27;&lt;div class=&quot;swx-stat&quot;&gt;&lt;b&gt;&#x27;+d.batches.length+&#x27;&lt;/b&gt;&lt;span&gt;Batches&lt;/span&gt;&lt;/div&gt;&#x27;+
        &#x27;&lt;div class=&quot;swx-line&quot;&gt;&lt;b&gt;Room utilisation&lt;/b&gt;&lt;span&gt;&#x27;+d.occupancy+&#x27;%&lt;/span&gt;&lt;/div&gt;&#x27;+
        &#x27;&lt;div class=&quot;swx-line&quot;&gt;&lt;b&gt;Highest faculty load&lt;/b&gt;&lt;span&gt;&#x27;+ (d.maxFaculty||&quot;—&quot;)+&#x27; · &#x27;+d.maxLoad+&#x27;&lt;/span&gt;&lt;/div&gt;&#x27;+
        &#x27;&lt;details class=&quot;swx-detail&quot;&gt;&lt;summary&gt;Live conflict report · &#x27;+d.issues.length+&#x27;&lt;/summary&gt;&lt;div class=&quot;swx-small&quot;&gt;&#x27;+
          (iss.length?iss.map(x=&gt;&#x27;• &#x27;+x).join(&#x27;&lt;br&gt;&#x27;):&#x27;✓ No current faculty/room/batch mapping conflicts detected.&#x27;)+
          (d.issues.length&gt;8?&#x27;&lt;br&gt;…and &#x27;+(d.issues.length-8)+&#x27; more&#x27;:&#x27;&#x27;)+
        &#x27;&lt;/div&gt;&lt;/details&gt;&#x27;+
        &#x27;&lt;div class=&quot;swx-actions&quot;&gt;&#x27;+
          &#x27;&lt;button class=&quot;btn sec swx-action&quot; data-swx=&quot;add-faculty&quot;&gt;Add faculty&lt;/button&gt;&#x27;+
          &#x27;&lt;button class=&quot;btn sec swx-action&quot; data-swx=&quot;add-subject&quot;&gt;Add subject&lt;/button&gt;&#x27;+
          &#x27;&lt;button class=&quot;btn sec swx-action&quot; data-swx=&quot;add-room&quot;&gt;Add room&lt;/button&gt;&#x27;+
          &#x27;&lt;button class=&quot;btn sec swx-action&quot; data-swx=&quot;add-batch&quot;&gt;Add batch&lt;/button&gt;&#x27;+
          &#x27;&lt;button class=&quot;btn swx-action&quot; data-swx=&quot;seed&quot;&gt;Load demo data&lt;/button&gt;&#x27;+
        &#x27;&lt;/div&gt;&#x27;+
        &#x27;&lt;div class=&quot;swx-version&quot;&gt;&lt;b&gt;Draft / publish history&lt;/b&gt;&#x27;+
          (v.length?&#x27;&lt;select id=&quot;swx-version-select&quot;&gt;&#x27;+v.slice().reverse().map(z=&gt;&#x27;&lt;option value=&quot;&#x27;+z.ver+&#x27;&quot;&gt;Published v&#x27;+z.ver+&#x27; · &#x27;+new Date(z.at).toLocaleString()+&#x27;&lt;/option&gt;&#x27;).join(&quot;&quot;)+&#x27;&lt;/select&gt;&#x27;+
          &#x27;&lt;button class=&quot;btn sec swx-action&quot; data-swx=&quot;rollback&quot;&gt;Rollback selected&lt;/button&gt;&#x27;:&#x27;&lt;span class=&quot;swx-small&quot;&gt;No local versions recorded yet.&lt;/span&gt;&#x27;)+
        &#x27;&lt;/div&gt;&#x27;;
    }catch(e){
      body.innerHTML=&#x27;&lt;div class=&quot;swx-small&quot;&gt;Dashboard unavailable: &#x27;+e.message+&#x27;&lt;/div&gt;&#x27;;
    }
  }

  async function addFaculty(){
    const name=prompt(&quot;Faculty name&quot;);if(!name)return;
    const max=parseInt(prompt(&quot;Maximum daily lectures&quot;,&quot;4&quot;)||&quot;4&quot;,10);
    await api(&quot;/faculty/&quot;,{method:&quot;POST&quot;,body:JSON.stringify({name,max_daily_lectures:Number.isFinite(max)?max:4})});
    await syncBackend();refreshAdminDashboard();
  }
  async function addSubject(){
    const name=prompt(&quot;Subject name&quot;);if(!name)return;
    const practical=confirm(&quot;Is this a laboratory/practical subject?&quot;);
    await api(&quot;/subjects/&quot;,{method:&quot;POST&quot;,body:JSON.stringify({name,is_practical:practical})});
    await syncBackend();refreshAdminDashboard();
  }
  async function addRoom(){
    const room_number=prompt(&quot;Room number/name&quot;);if(!room_number)return;
    const lab=confirm(&quot;Is this a lab room?&quot;);
    await api(&quot;/rooms/&quot;,{method:&quot;POST&quot;,body:JSON.stringify({room_number,is_lab:lab})});
    await syncBackend();refreshAdminDashboard();
  }
  async function addBatch(){
    const name=prompt(&quot;Batch name (example: CSE-3C)&quot;);if(!name)return;
    await api(&quot;/batches/&quot;,{method:&quot;POST&quot;,body:JSON.stringify({name})});
    await syncBackend();refreshAdminDashboard();
  }
  async function seed(){
    await api(&quot;/demo/seed&quot;,{method:&quot;POST&quot;});await syncBackend();refreshAdminDashboard();
  }

  async function backendCalendar(){
    const u=user();if(!u)return;
    const url=API+&quot;/calendar/&quot;+u.id+&quot;.ics&quot;;
    window.open(url,&quot;_blank&quot;,&quot;noopener&quot;);
  }

  async function notificationData(){
    const u=user();if(!u)return [];
    try{return await api(&quot;/notifications/user/&quot;+u.id)}catch(e){return []}
  }

  async function leaveToBackend(localReq){
    const u=user();if(!u||ROLE!==&quot;faculty&quot;)return;
    const x=state();if(!x)return;
    const e=x.S.pub.E.find(z=&gt;z.b===localReq.b&amp;&amp;z.d===localReq.d&amp;&amp;z.p===localReq.p&amp;&amp;z.s===localReq.s);
    if(!e||!e.apiId)return;
    const reason=prompt(&quot;Why can&#x27;t you attend this class?&quot;,&quot;Faculty leave / unavailable&quot;);if(reason===null)return;
    try{
      const [faculties,mappings,allEntries]=await Promise.all([api(&quot;/faculty/&quot;),api(&quot;/faculty-subjects/&quot;),api(&quot;/timetable/&quot;)]);
      const subjectId=e.apiSubjectId;
      const candidates=faculties.filter(f=&gt;f.id!==u.faculty_id&amp;&amp;mappings.some(m=&gt;m.faculty_id===f.id&amp;&amp;m.subject_id===subjectId));
      const daySlotEntries=allEntries.filter(z=&gt;z.time_slot_id===e.apiTimeSlotId);
      const daily={};
      allEntries.forEach(z=&gt;{
        if(z.faculty_id!==e.apiFacultyId)return;
        daily[z.time_slot_id]=(daily[z.time_slot_id]||0)+1;
      });
      const chosen=candidates.find(f=&gt;!daySlotEntries.some(z=&gt;z.faculty_id===f.id)&amp;&amp;daily[e.apiTimeSlotId]!==undefined?true:true);
      const body={timetable_entry_id:e.apiId,original_faculty_id:u.faculty_id,substitute_faculty_id:chosen?chosen.id:null,reason,status:&quot;PENDING&quot;};
      const created=await api(&quot;/substitution-requests/&quot;,{method:&quot;POST&quot;,body:JSON.stringify(body)});
      const key=e.t+&quot;|&quot;+e.b+&quot;|&quot;+e.d+&quot;|&quot;+e.p;
      const x2=state();
      const r=x2?.S?.req?.find(q=&gt;q.from===e.t&amp;&amp;q.b===e.b&amp;&amp;q.d===e.d&amp;&amp;q.p===e.p);
      if(r){r.apiId=created.id;r.apiCandidateId=chosen?chosen.id:null;r.reason=reason;saveState(x2.S)}
    }catch(err){
      alert(&quot;Leave request could not be sent to the backend:\n&quot;+err.message);
    }
  }

  async function respondBackend(localId,accepted){
    const x=state();if(!x)return;
    const r=x.S.req.find(q=&gt;q.id===localId);if(!r||!r.apiId)return;
    let reason=null;if(!accepted){reason=prompt(&quot;Reason for declining the class request&quot;,&quot;Not available at that time&quot;);if(reason===null)return}
    try{
      await api(&quot;/substitution-requests/&quot;+r.apiId+&quot;/respond?accepted=&quot;+(accepted?&quot;true&quot;:&quot;false&quot;)+(reason?(&quot;&amp;reason=&quot;+encodeURIComponent(reason)):&quot;&quot;),{method:&quot;POST&quot;});
      if(!accepted&amp;&amp;r.c&amp;&amp;r.c[r.i]){
        const candKey=Object.keys(x.T||{}).find(k=&gt;k===r.c[r.i]);
        const facId=user()?.faculty_id||null;
        /* Next candidate creation is handled by the local cascade; backend gets the current response above. */
      }
      await syncBackend();
    }catch(err){alert(&quot;Backend response failed:\n&quot;+err.message)}
  }

  function notificationsCard(list){
    return &#x27;&lt;div class=&quot;card swx-notify&quot;&gt;&lt;div class=&quot;swx-nhead&quot;&gt;&lt;h3&gt;Notifications&lt;/h3&gt;&lt;span class=&quot;badge&quot; style=&quot;--c:var(--info)&quot;&gt;&#x27;+list.filter(x=&gt;!x.is_read).length+&#x27; unread&lt;/span&gt;&lt;/div&gt;&#x27;+
      (list.length?&#x27;&lt;ul class=&quot;pt-l&quot;&gt;&#x27;+list.slice().reverse().slice(0,5).map(n=&gt;&#x27;&lt;li&gt;&lt;b&gt;&#x27;+String(n.message||&quot;Notification&quot;).replace(/&lt;/g,&quot;&amp;lt;&quot;)+&#x27;&lt;/b&gt;&lt;br&gt;&lt;span class=&quot;mute&quot;&gt;&#x27;+(n.is_read?&quot;Read&quot;:&quot;New&quot;)+&#x27;&lt;/span&gt;&lt;/li&gt;&#x27;).join(&quot;&quot;)+&#x27;&lt;/ul&gt;&#x27;:&#x27;&lt;p style=&quot;margin:0&quot;&gt;No backend notifications yet.&lt;/p&gt;&#x27;)+
      &#x27;&lt;/div&gt;&#x27;;
  }

  async function addNotifications(){
    if(!root)return;
    const holder=document.getElementById(&quot;swx-notify-holder&quot;);if(!holder)return;
    const list=await notificationData();
    holder.innerHTML=notificationsCard(list);
  }

  function mountEnhancements(){
    if(!root)return;
    if(ROLE===&quot;admin&quot;&amp;&amp;!document.getElementById(&quot;swx-admin&quot;)){
      root.insertAdjacentHTML(&quot;beforeend&quot;,
        &#x27;&lt;div class=&quot;card swx-panel&quot; id=&quot;swx-admin&quot;&gt;&lt;div class=&quot;swx-panel-head&quot;&gt;&lt;div&gt;&lt;h3&gt;Live control center&lt;/h3&gt;&lt;p class=&quot;mute&quot;&gt;Connected to FastAPI + Supabase PostgreSQL&lt;/p&gt;&lt;/div&gt;&lt;span id=&quot;swx-backend-status&quot; class=&quot;badge&quot; style=&quot;--c:var(--ok)&quot;&gt;Backend ready&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;swx-grid&quot; id=&quot;swx-admin-body&quot;&gt;&lt;/div&gt;&lt;/div&gt;&#x27;);
      refreshAdminDashboard();
    }
    if(ROLE!==&quot;admin&quot;&amp;&amp;!document.getElementById(&quot;swx-notify-holder&quot;)){
      root.insertAdjacentHTML(&quot;beforeend&quot;,&#x27;&lt;div id=&quot;swx-notify-holder&quot;&gt;&lt;/div&gt;&#x27;);
      addNotifications();
    }
    if(!document.getElementById(&quot;swx-calendar-backend&quot;)){
      root.insertAdjacentHTML(&quot;beforeend&quot;,
        &#x27;&lt;div class=&quot;card swx-panel&quot; id=&quot;swx-calendar-backend&quot;&gt;&lt;div class=&quot;swx-panel-head&quot;&gt;&lt;div&gt;&lt;h3&gt;Backend calendar &amp; data&lt;/h3&gt;&lt;p class=&quot;mute&quot;&gt;Use the real timetable stored in Supabase.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;swx-actions&quot;&gt;&lt;button class=&quot;btn swx-action&quot; data-swx=&quot;backend-calendar&quot;&gt;Open backend .ics&lt;/button&gt;&lt;button class=&quot;btn sec swx-action&quot; data-swx=&quot;refresh-backend&quot;&gt;Refresh data&lt;/button&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;swx-small&quot;&gt;The existing SlotWise animations and local editor stay unchanged.&lt;/div&gt;&lt;/div&gt;&#x27;);
    }
  }

  window.__swxBackendStatus=function(message){
    const el=document.getElementById(&quot;swx-backend-status&quot;);if(el)el.textContent=message;
  };

  if(root){
    const observer=new MutationObserver(()=&gt;{mountEnhancements()});
    observer.observe(root,{childList:true,subtree:false});
    setTimeout(()=&gt;mountEnhancements(),120);

    /* Keep the original root handler/animations. Only intercept our newly-added controls. */
    root.addEventListener(&quot;click&quot;,async ev=&gt;{
      const t=ev.target.closest(&quot;.swx-action&quot;);
      if(t){
        ev.stopImmediatePropagation();
        const action=t.dataset.swx;
        try{
          if(action===&quot;add-faculty&quot;)await addFaculty();
          else if(action===&quot;add-subject&quot;)await addSubject();
          else if(action===&quot;add-room&quot;)await addRoom();
          else if(action===&quot;add-batch&quot;)await addBatch();
          else if(action===&quot;seed&quot;)await seed();
          else if(action===&quot;backend-calendar&quot;)await backendCalendar();
          else if(action===&quot;refresh-backend&quot;)await syncBackend();
          else if(action===&quot;rollback&quot;){const s=document.getElementById(&quot;swx-version-select&quot;);if(s)rollbackVersion(s.value)}
        }catch(e){alert(e.message||&quot;Action failed&quot;)}
        return;
      }
      const k=t||ev.target.closest(&quot;button&quot;);
      if(!k)return;
      if(k.id===&quot;p-gen&quot;&amp;&amp;ROLE===&quot;admin&quot;){setTimeout(backendGenerate,80)}
      if(k.id===&quot;p-pub&quot;&amp;&amp;ROLE===&quot;admin&quot;){setTimeout(recordVersion,80)}
      if(k.dataset&amp;&amp;k.dataset.k&amp;&amp;ROLE===&quot;faculty&quot;){
        const parts=k.dataset.k.split(&quot;,&quot;);
        const x=state();
        const lr=x&amp;&amp;x.S.req.find(q=&gt;String(q.b)===String(parts[0])&amp;&amp;String(q.d)===String(parts[1])&amp;&amp;String(q.p)===String(parts[2]));
        if(lr)setTimeout(()=&gt;leaveToBackend(lr),60);
      }
      if(k.dataset&amp;&amp;k.dataset.y&amp;&amp;ROLE===&quot;faculty&quot;){setTimeout(()=&gt;respondBackend(+k.dataset.y,true),60)}
      if(k.dataset&amp;&amp;k.dataset.n&amp;&amp;ROLE===&quot;faculty&quot;){setTimeout(()=&gt;respondBackend(+k.dataset.n,false),60)}
    },false);

    addEventListener(&quot;sw-login&quot;,()=&gt;setTimeout(()=&gt;{syncBackend().catch(()=&gt;{});mountEnhancements()},80));

    /* Auto-refresh backend dashboard/data every 30 seconds. */
    setInterval(()=&gt;{if(document.visibilityState!==&quot;hidden&quot;)syncBackend().catch(()=&gt;{})},30000);
  }
})();
&lt;/script&gt;
&lt;/body&gt;

h1{font-size:clamp(34px,5vw,56px);line-height:1.06;font-weight:700}
h2{font-size:clamp(26px,3.2vw,38px);line-height:1.15;font-weight:700}
h3{font-size:18px;line-height:26px;font-weight:600;letter-spacing:-.01em}
p{margin:0}.mute{color:var(--mute)}
nav.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--border);padding-top:env(safe-area-inset-top,0px)}
nav.top .wrap{display:flex;align-items:center;gap:24px;height:64px}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:18px;text-decoration:none;letter-spacing:-.02em}
.logo i{width:28px;height:28px;border-radius:8px;background:var(--primary);display:grid;place-items:center;color:var(--on-primary);font-style:normal;font-size:14px}
.links{display:flex;gap:4px;margin-left:auto}
.links a{padding:10px 12px;text-decoration:none;color:var(--mute);font-size:14px;border-radius:8px;transition:color .15s}
.links a:hover{color:var(--ink)}
.btn{display:inline-flex;align-items:center;justify-content:center;height:40px;padding:0 16px;border-radius:8px;font:600 14px var(--sans);text-decoration:none;border:1px solid var(--primary);background:var(--primary);color:var(--on-primary);cursor:pointer;transition:filter .15s,background .15s;min-width:44px}
.btn:hover{filter:brightness(.92)}
.btn.lg{height:48px;padding:0 22px;font-size:15px}
.btn.sec{background:var(--surface);color:var(--primary)}
.btn.ok{background:#059669;border-color:#059669}
.btn.icon{background:transparent;border-color:var(--border);color:var(--ink);width:40px;padding:0}
@media(max-width:760px){.links{display:none}nav.top .btn.sec{display:none}nav.top .btn.icon{margin-left:auto}}
/* HERO */
#hero{height:340vh;position:relative}
.stage{position:sticky;top:64px;height:calc(100vh - 64px);height:calc(100svh - 64px);display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:48px;align-items:center;padding-bottom:16px}
.copy p.lead{margin-top:16px;color:var(--mute);max-width:46ch;font-size:17px;line-height:26px}
.cta{display:flex;gap:12px;margin-top:24px;flex-wrap:wrap}
ol.steps{list-style:none;margin:32px 0 0;padding:0;display:grid;gap:4px;counter-reset:s}
ol.steps li{counter-increment:s;display:flex;gap:12px;align-items:flex-start;padding:8px 12px;border-radius:8px;color:var(--mute);font-size:14px;line-height:20px;border-left:3px solid var(--border);transition:background .2s,color .2s,border-color .2s}
ol.steps li.on{background:var(--tint);color:var(--ink);border-left-color:var(--primary);font-weight:500}
ol.steps li::before{content:counter(s);font:500 12px var(--mono);color:var(--primary);padding-top:1px}
.board{background:var(--surface);border:1px solid var(--border);border-radius:16px;box-shadow:0 12px 32px rgba(0,0,0,.14);padding:12px 12px 14px;position:relative;min-width:0}
.bar{display:flex;align-items:center;gap:8px;padding:2px 4px 10px;font-size:13px;flex-wrap:wrap}
.bar b{font-weight:600}
.chip{margin-left:auto;display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:600;font-variant-numeric:tabular-nums;border:1px solid currentColor;color:var(--err);background:color-mix(in srgb,var(--err) 10%,transparent);transition:color .2s}
.chip.good{color:var(--ok);background:color-mix(in srgb,var(--ok) 10%,transparent)}
.days{display:grid;grid-template-columns:repeat(5,1fr);gap:0;font-size:12px;color:var(--mute);font-weight:500;margin-bottom:6px}
.days span{padding:0 6px}
.grid{position:relative;width:100%;aspect-ratio:5/4.2;background:repeating-linear-gradient(0deg,transparent 0 calc(25% - 1px),var(--border) calc(25% - 1px) 25%),repeating-linear-gradient(90deg,transparent 0 calc(20% - 1px),var(--border) calc(20% - 1px) 20%);border-radius:8px}
.blk{position:absolute;padding:3px;will-change:transform}
.blk&gt;div{height:100%;border-left:4px solid var(--c);background:color-mix(in srgb,var(--c) 13%,var(--surface));border-radius:6px;padding:5px 7px;overflow:hidden;font-size:11px;line-height:14px;color:var(--ink);box-shadow:0 0 0 1px transparent;transition:box-shadow .2s,background .3s,border-color .3s}
.blk b{display:block;font-size:12.5px;line-height:16px;font-weight:600;white-space:nowrap;text-overflow:ellipsis;overflow:hidden}
.blk span{display:block;color:var(--mute);white-space:nowrap;text-overflow:ellipsis;overflow:hidden}
.blk.clash&gt;div{box-shadow:0 0 0 2px var(--err)}
.blk .tag{display:none;margin-top:3px;font-weight:600;color:var(--warn);font-size:10.5px;white-space:normal}
.blk.sub&gt;div{--c:#F59E0B;animation:pulse .6s ease-out}
.blk.sub .tag{display:block}
.blk.sub .n{display:none}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(245,158,11,.7)}100%{box-shadow:0 0 0 12px rgba(245,158,11,0)}}
.toast{position:absolute;right:16px;bottom:-14px;background:var(--ink);color:var(--bg);font-size:13px;font-weight:500;padding:10px 14px;border-radius:10px;box-shadow:0 12px 32px rgba(0,0,0,.25);opacity:0;transform:translateY(8px);transition:opacity .2s,transform .2s;max-width:calc(100% - 32px)}
.toast.on{opacity:1;transform:none}
.cue{position:absolute;left:0;bottom:8px;font-size:13px;color:var(--mute);transition:opacity .3s}
@media(max-width:900px){
 .stage{grid-template-columns:1fr;gap:14px;align-content:start;padding-top:16px}
 h1{font-size:30px}.copy p.lead,.steps,.cue{display:none}.cta{margin-top:14px}
 .blk b{font-size:11px}.blk span{display:none}.blk .tag{font-size:9px}
}
/* SECTIONS */
section.s{padding:96px 0}
.head{max-width:60ch;margin-bottom:40px}.head p{margin-top:12px;color:var(--mute);font-size:17px;line-height:26px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:24px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:24px;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.card h3{margin-bottom:4px}.card&gt;p{color:var(--mute);font-size:14px;line-height:20px;margin-bottom:16px}
dl.rules{margin:0;display:grid;gap:0}
dl.rules div{display:grid;grid-template-columns:56px 1fr;gap:12px;padding:12px 0;border-top:1px solid var(--border);font-size:14px;line-height:20px}
dl.rules dt{font:500 12px var(--mono);color:var(--primary);padding-top:2px}
dl.rules dd{margin:0}
.badge{display:inline-flex;align-items:center;gap:6px;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:500;background:color-mix(in srgb,var(--c) 14%,transparent);color:var(--c)}
.badge::before{content:&quot;&quot;;width:6px;height:6px;border-radius:50%;background:currentColor}
.sub-wrap{display:grid;grid-template-columns:1fr 1fr;gap:48px;align-items:center}
ol.tl{list-style:none;margin:0;padding:0;display:grid;gap:0}
ol.tl li{position:relative;padding:0 0 28px 40px}
ol.tl li:last-child{padding-bottom:0}
ol.tl li::before{content:&quot;&quot;;position:absolute;left:11px;top:24px;bottom:0;width:2px;background:var(--border)}
ol.tl li:last-child::before{display:none}
ol.tl li i{position:absolute;left:0;top:0;width:24px;height:24px;border-radius:50%;background:var(--tint);color:var(--primary);display:grid;place-items:center;font:600 12px var(--mono);font-style:normal}
ol.tl h3{font-size:16px;line-height:24px}ol.tl p{font-size:14px;line-height:20px;color:var(--mute)}
.inv{border-left:4px solid #F59E0B}
.inv .row{display:flex;gap:12px;margin-top:16px;flex-wrap:wrap}
.inv .meta{font-size:14px;line-height:22px;color:var(--mute)}
.inv .meta b{color:var(--ink)}
.feed{display:flex;gap:8px;align-items:center;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:6px 6px 6px 12px;font:500 13px var(--mono);margin:16px 0}
.feed span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--mute)}
.feed .btn{height:32px;font-size:13px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:0;border:1px solid var(--border);border-radius:12px;background:var(--surface);overflow:hidden}
.stats div{padding:28px 24px;border-left:1px solid var(--border)}.stats div:first-child{border-left:0}
.stats b{display:block;font-size:40px;line-height:44px;font-weight:700;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.stats span{font-size:14px;line-height:20px;color:var(--mute);display:block;margin-top:6px}
.final{background:var(--primary);color:var(--on-primary);border-radius:16px;padding:56px 32px;text-align:center}
.final p{margin:12px auto 24px;max-width:48ch;opacity:.92}
.final .btn{background:var(--on-primary);color:var(--primary);border-color:var(--on-primary)}
footer{padding:32px 0 48px;border-top:1px solid var(--border);color:var(--mute);font-size:14px}
footer .wrap{display:flex;gap:24px;flex-wrap:wrap;justify-content:space-between}
@media(max-width:900px){.two,.sub-wrap{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}.stats div:nth-child(3){border-left:0}.stats div:nth-child(n+3){border-top:1px solid var(--border)}section.s{padding:64px 0}.wrap{padding:0 16px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
/* ROLE WORKSPACE */
.pt-bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.pt-bar .chip{margin-left:0}.pt-bar .sp{margin-left:auto}
.pt-bar select,.pt-f select{height:40px;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--ink);font:500 14px var(--sans);padding:0 10px}
.btn[disabled]{opacity:.45;pointer-events:none}
.pt-note{font-size:13px;color:var(--mute);margin:0 0 12px;min-height:20px}
.pt-g{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:24px;align-items:start}
.pt-g&gt;div&gt;.card+.card{margin-top:24px}
.pt-t{width:100%;min-width:620px;border-collapse:separate;border-spacing:4px;table-layout:fixed}
.pt-t th{font:500 12px var(--sans);color:var(--mute);text-align:left;padding:0 6px}
.pt-t th:first-child{width:56px;font-family:var(--mono);padding:0}
.pt-t td{height:64px;vertical-align:top;padding:0}
.pt-t td.lu{height:22px;font-size:12px;color:var(--mute);text-align:center}
.pt-c{display:block;width:100%;height:100%;min-height:60px;border:0;border-left:4px solid var(--c);background:color-mix(in srgb,var(--c) 13%,var(--surface));border-radius:6px;padding:5px 7px;overflow:hidden;font:400 11px/14px var(--sans);text-align:left;color:var(--ink)}
button.pt-c{cursor:pointer}
.pt-c b,.pt-c span,.pt-c em{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pt-c b{font:600 12.5px/16px var(--sans)}
.pt-c span{color:var(--mute)}
.pt-c em{font-style:normal;font-weight:600;color:var(--warn);font-size:10.5px}
.pt-c.x b{text-decoration:line-through}.pt-c.x em{color:var(--err)}
.pt-c.on{box-shadow:0 0 0 2px var(--primary)}
.pt-l{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.pt-l li{border-top:1px solid var(--border);padding-top:12px;font-size:14px;line-height:20px}
.pt-l li:first-child{border-top:0;padding-top:0}
.pt-l .row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.pt-f{display:grid;gap:6px;margin:12px 0}.pt-f label{font-size:12px;color:var(--mute)}
.pt .card&gt;.row{display:flex;gap:8px;flex-wrap:wrap}
@media(max-width:900px){.pt-g{grid-template-columns:1fr}}

(function(){
  const API=&quot;http://127.0.0.1:8000&quot;;
  const ROLE=(window.parent&&window.parent.document&&window.parent.document.documentElement.dataset.role)||document.documentElement.dataset.role;
  const root=document.getElementById(&quot;ptl&quot;);

  const api=async(path,opts)=&gt;{
    const res=await fetch(API+path,Object.assign({headers:{&quot;Content-Type&quot;:&quot;application/json&quot;}},opts||{}));
    const text=await res.text();let data=null;try{data=text?JSON.parse(text):null}catch(e){data=text}
    if(!res.ok)throw new Error((data&amp;&amp;data.detail)||&quot;Backend request failed (&quot;+res.status+&quot;)&quot;);
    return data;
  };
  const user=()=&gt;{
    try{return parent.__SW_PARENT_USER||JSON.parse(parent.sessionStorage.getItem(&quot;sw_user&quot;)||&quot;null&quot;)}catch(e){return null}
  };
  const clone=x=&gt;JSON.parse(JSON.stringify(x));
  const slug=s=&gt;String(s||&quot;&quot;).toLowerCase().replace(/[^a-z0-9]+/g,&quot;_&quot;).replace(/^_|_$/g,&quot;&quot;);
  const subjectKey=n=&gt;{
    const m={&quot;Data Structures&quot;:&quot;DS&quot;,&quot;Database Systems&quot;:&quot;DBMS&quot;,&quot;Operating Systems&quot;:&quot;OS&quot;,&quot;Computer Networks&quot;:&quot;CN&quot;,&quot;Discrete Mathematics&quot;:&quot;MA&quot;,&quot;Discrete Maths&quot;:&quot;MA&quot;,&quot;DBMS Lab&quot;:&quot;DBL&quot;,&quot;OS Lab&quot;:&quot;OSL&quot;};
    return m[n]||(&quot;S_&quot;+slug(n).slice(0,18));
  };
  const facultyKey=n=&gt;{
    const m={&quot;Dr. Rao&quot;:&quot;rao&quot;,&quot;Dr. Iyer&quot;:&quot;iyer&quot;,&quot;Prof. Nair&quot;:&quot;nair&quot;,&quot;Dr. Sen&quot;:&quot;sen&quot;,&quot;Dr. Bose&quot;:&quot;bose&quot;,&quot;Prof. Bose&quot;:&quot;bose&quot;,&quot;Prof. Mehta&quot;:&quot;mehta&quot;};

    const x=state();if(!x)return;
    const e=x.S.pub.E.find(z=&gt;z.b===localReq.b&amp;&amp;z.d===localReq.d&amp;&amp;z.p===localReq.p&amp;&amp;z.s===localReq.s);

    try{
      const [faculties,mappings,allEntries]=await Promise.all([api(&quot;/faculty/&quot;),api(&quot;/faculty-subjects/&quot;),api(&quot;/timetable/&quot;)]);

        if(z.faculty_id!==e.apiFacultyId)return;
        daily[z.time_slot_id]=(daily[z.time_slot_id]||0)+1;
      });
      const chosen=candidates.find(f=&gt;!daySlotEntries.some(z=&gt;z.faculty_id===f.id)&amp;&amp;daily[e.apiTimeSlotId]!==undefined?true:true);

      if(!accepted&amp;&amp;r.c&amp;&amp;r.c[r.i]){

    if(ROLE===&quot;admin&quot;&amp;&amp;!document.getElementById(&quot;swx-admin&quot;)){

      refreshAdminDashboard();

    if(ROLE!==&quot;admin&quot;&amp;&amp;!document.getElementById(&quot;swx-notify-holder&quot;)){
      root.insertAdjacentHTML(&quot;beforeend&quot;,&#x27;&lt;div id=&quot;swx-notify-holder&quot;&gt;&lt;/div&gt;&#x27;);
      addNotifications();
    }
    if(!document.getElementById(&quot;swx-calendar-backend&quot;)){
      root.insertAdjacentHTML(&quot;beforeend&quot;,
        &#x27;&lt;div class=&quot;card swx-panel&quot; id=&quot;swx-calendar-backend&quot;&gt;&lt;div class=&quot;swx-panel-head&quot;&gt;&lt;div&gt;&lt;h3&gt;Backend calendar &amp; data&lt;/h3&gt;&lt;p class=&quot;mute&quot;&gt;Use the real timetable stored in Supabase.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;swx-actions&quot;&gt;&lt;button class=&quot;btn swx-action&quot; data-swx=&quot;backend-calendar&quot;&gt;Open backend .ics&lt;/button&gt;&lt;button class=&quot;btn sec swx-action&quot; data-swx=&quot;refresh-backend&quot;&gt;Refresh data&lt;/button&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;swx-small&quot;&gt;The existing SlotWise animations and local editor stay unchanged.&lt;/div&gt;&lt;/div&gt;&#x27;);
    }
  }

  window.__swxBackendStatus=function(message){
    const el=document.getElementById(&quot;swx-backend-status&quot;);if(el)el.textContent=message;
  };

  if(root){
    const observer=new MutationObserver(()=&gt;{mountEnhancements()});
    observer.observe(root,{childList:true,subtree:false});
    setTimeout(()=&gt;mountEnhancements(),120);

    /* Keep the original root handler/animations. Only intercept our newly-added controls. */
    root.addEventListener(&quot;click&quot;,async ev=&gt;{
      const t=ev.target.closest(&quot;.swx-action&quot;);
      if(t){
        ev.stopImmediatePropagation();
        const action=t.dataset.swx;
        try{
          if(action===&quot;add-faculty&quot;)await addFaculty();
          else if(action===&quot;add-subject&quot;)await addSubject();
          else if(action===&quot;add-room&quot;)await addRoom();
          else if(action===&quot;add-batch&quot;)await addBatch();
          else if(action===&quot;seed&quot;)await seed();
          else if(action===&quot;backend-calendar&quot;)await backendCalendar();
          else if(action===&quot;refresh-backend&quot;)await syncBackend();
          else if(action===&quot;rollback&quot;){const s=document.getElementById(&quot;swx-version-select&quot;);if(s)rollbackVersion(s.value)}
        }catch(e){alert(e.message||&quot;Action failed&quot;)}
        return;
      }
      const k=t||ev.target.closest(&quot;button&quot;);
      if(!k)return;
      if(k.id===&quot;p-gen&quot;&amp;&amp;ROLE===&quot;admin&quot;){setTimeout(backendGenerate,80)}
      if(k.id===&quot;p-pub&quot;&amp;&amp;ROLE===&quot;admin&quot;){setTimeout(recordVersion,80)}
      if(k.dataset&amp;&amp;k.dataset.k&amp;&amp;ROLE===&quot;faculty&quot;){
        const parts=k.dataset.k.split(&quot;,&quot;);
        const x=state();
        const lr=x&amp;&amp;x.S.req.find(q=&gt;String(q.b)===String(parts[0])&amp;&amp;String(q.d)===String(parts[1])&amp;&amp;String(q.p)===String(parts[2]));
        if(lr)setTimeout(()=&gt;leaveToBackend(lr),60);
      }
      if(k.dataset&amp;&amp;k.dataset.y&amp;&amp;ROLE===&quot;faculty&quot;){setTimeout(()=&gt;respondBackend(+k.dataset.y,true),60)}
      if(k.dataset&amp;&amp;k.dataset.n&amp;&amp;ROLE===&quot;faculty&quot;){setTimeout(()=&gt;respondBackend(+k.dataset.n,false),60)}
    },false);

    addEventListener(&quot;sw-login&quot;,()=&gt;setTimeout(()=&gt;{syncBackend().catch(()=&gt;{});mountEnhancements()},80));

    /* Auto-refresh backend dashboard/data every 30 seconds. */
    setInterval(()=&gt;{if(document.visibilityState!==&quot;hidden&quot;)syncBackend().catch(()=&gt;{})},30000);
  }
})();
