<script>
/* ===== PriorityPlanners / SlotWise backend bridge =====
   Added without modifying the existing visual/animation code.
*/
(function(){
  const API="http://127.0.0.1:8000";
  const $=id=>document.getElementById(id);

  function getSavedUser(){
    try{return JSON.parse(sessionStorage.getItem("sw_user")||"null")}catch(e){return null}
  }
  function setSavedUser(u){
    try{sessionStorage.setItem("sw_user",JSON.stringify(u))}catch(e){}
  }
  async function api(path,opts){
    const res=await fetch(API+path,Object.assign({headers:{"Content-Type":"application/json"}},opts||{}));
    const text=await res.text();
    let data=null;try{data=text?JSON.parse(text):null}catch(e){data=text}
    if(!res.ok) throw new Error((data&&data.detail)||"Backend request failed ("+res.status+")");
    return data;
  }
  function openRole(r){
    const f=$("view-"+r);
    if(f&&!f.srcdoc)f.srcdoc=f.dataset.src;
    return f;
  }
  function wake(r){
    const f=$("view-"+r);
    if(f&&f.contentWindow){
      try{
        f.contentWindow.__SW_PARENT_USER=getSavedUser();
        f.contentWindow.dispatchEvent(new Event("sw-login"));
      }catch(e){}
    }
  }
  async function signIn(){
    const err=$("g-err"),u=$("g-user").value.trim().toLowerCase(),p=$("g-pass").value,role=document.querySelector("#gate .g-roles button[aria-checked=true]")?.dataset.role||"admin";
    if(!u||!p){err.textContent="Enter your username and password.";return}
    err.textContent="Signing in…";
    try{
      const data=await api("/auth/login",{method:"POST",body:JSON.stringify({username:u,password:p,role})});
      setSavedUser(data.user);
      try{sessionStorage.setItem("sw_role",role)}catch(e){}
      document.documentElement.classList.add("auth");
      document.documentElement.dataset.role=role;
      openRole(role);
      $("gform").reset();$("g-pass").type="password";
      window.scrollTo(0,0);
      setTimeout(()=>wake(role),60);
    }catch(e){
      err.textContent=e.message||"Unable to sign in.";
    }
  }

  const form=$("gform"),go=$(".g-go");
  if(form){
    form.addEventListener("submit",e=>{e.preventDefault();e.stopImmediatePropagation();signIn()},true);
    ["g-user","g-pass"].forEach(id=>{
      const el=$(id);if(el)el.addEventListener("keydown",e=>{
        if(e.key==="Enter"){e.preventDefault();e.stopImmediatePropagation();signIn()}
      },true);
    });
  }
  if(go)go.addEventListener("click",e=>{e.preventDefault();e.stopImmediatePropagation();signIn()},true);

  addEventListener("message",e=>{
    if(e.data&&e.data.sw==="out"){
      try{sessionStorage.removeItem("sw_user")}catch(x){}
    }
  });

  try{
    const u=getSavedUser();
    const r=sessionStorage.getItem("sw_role");
    if(u&&r){setTimeout(()=>wake(r),250)}
  }catch(e){}
})();
</script>

      const d=frame.contentDocument; if(!d) return;
      const buttons=[...d.querySelectorAll('a.btn,button')].filter(x=>x.textContent.trim()==='Generate timetable');
      buttons.forEach((b,i)=>{
        const isTop=b.matches('nav a.btn') || b.closest('nav');
        const isConfig=b.id==='pp-generate';
        if(isConfig) return;
        if(!isTop) b.style.display='none';
      });
      const bottom=[...d.querySelectorAll('a.btn.lg')].filter(x=>x.textContent.trim()==='Generate timetable');
      if(bottom.length) bottom[bottom.length-1].style.display='inline-flex';
    }catch(e){}
  }
  function run(){document.querySelectorAll('iframe.dash').forEach(f=>{clean(f); f.addEventListener('load',()=>clean(f));});}
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',run); else run();
})();
</script>

<script id="pp-local-fixes">
(function(){
  function lockParentScroll(){
    if(document.documentElement.classList.contains("auth")){
      document.documentElement.style.overflow="hidden";
      document.body.style.overflow="hidden";
      document.body.style.height="100vh";
    }else{
      document.documentElement.style.overflow="";
      document.body.style.overflow="";
      document.body.style.height="";
    }
  }
  new MutationObserver(lockParentScroll).observe(document.documentElement,{attributes:true,attributeFilter:["class","data-role"]});
  lockParentScroll();

  const API="http://127.0.0.1:8000";
  const esc=v=>String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]));

  async function api(path,opts){
    const res=await fetch(API+path,Object.assign({headers:{"Content-Type":"application/json"}},opts||{}));
    const txt=await res.text(); let data=null;
    try{data=txt?JSON.parse(txt):null}catch(e){data=txt}
    if(!res.ok) throw new Error((data&&data.detail)||"Request failed ("+res.status+")");
    return data;
  }

  function frame(){return document.getElementById("view-admin");}

  async function renderManager(){
    const f=frame();
    if(!f||!f.contentDocument) return;
    const d=f.contentDocument;
    const host=d.getElementById("swx-admin-body");
    if(!host) return;
    let box=d.getElementById("pp-data-manager");
    if(box) return;
    box=d.createElement("div");
    box.id="pp-data-manager";
    box.style.cssText="margin-top:16px;padding:16px;border:1px solid #2c2a22;border-radius:12px;background:#0e0d0b;color:#e8e3cf;font-family:Arial,sans-serif";
    box.innerHTML='<div style="display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap"><div><b style="font-size:16px">Manage timetable data</b><div style="font-size:12px;color:#9a957d;margin-top:4px">Add, edit or delete Faculty, Rooms, Subjects and Batches. Changes are saved to PostgreSQL.</div></div><div style="display:flex;gap:7px;flex-wrap:wrap"><button id="pp-clear-timetable" class="btn" style="height:34px;background:#8b3a2e">Clear generated timetable</button><button id="pp-refresh-data" class="btn sec" style="height:34px">Refresh</button></div></div><div id="pp-data-lists" style="margin-top:12px"></div>';
    host.appendChild(box);
    d.getElementById("pp-refresh-data").onclick=()=>loadManager(true);
    d.getElementById("pp-clear-timetable").onclick=clearGeneratedTimetable;
    await loadManager(false);
  }

  async function clearGeneratedTimetable(){
    const f=frame();
    if(!f||!f.contentDocument) return;
    const d=f.contentDocument;
    const ok=confirm("Clear the generated timetable?\n\nThis removes generated timetable entries, saved generation requirements/configuration, generated time slots, calendar events and substitution requests linked to those entries. Faculty, rooms, subjects and batches will NOT be deleted.");
    if(!ok) return;
    try{
      const result=await api("/timetable/clear",{method:"DELETE"});
      if(f.contentWindow&&typeof f.contentWindow.PP_refreshBackend==="function") await f.contentWindow.PP_refreshBackend();
      await loadManager(false);
      alert(result.message||"Generated timetable cleared successfully.");
    }catch(e){
      alert("Clear failed: "+e.message);
    }
  }

  async function loadManager(showError){
    const f=frame(); if(!f||!f.contentDocument)return;
    const d=f.contentDocument, lists=d.getElementById("pp-data-lists");
    if(!lists)return;
    try{
      const [faculty,rooms,subjects,batches]=await Promise.all([api("/faculty/"),api("/rooms/"),api("/subjects/"),api("/batches/")]);
      const section=(title,items,type,formatter)=>{
        const rows=items.length?items.map(x=>'<div style="display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 0;border-top:1px solid #25231d"><span style="min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+formatter(x)+'</span><span style="display:flex;gap:6px;flex:none"><button class="btn sec pp-edit" data-type="'+type+'" data-id="'+x.id+'" style="height:30px;padding:0 10px">Edit</button><button class="btn pp-delete" data-type="'+type+'" data-id="'+x.id+'" style="height:30px;padding:0 10px">Delete</button></span></div>').join(""): '<div style="padding:8px 0;color:#9a957d;font-size:12px">No records.</div>';
        return '<details open style="margin-top:10px"><summary style="cursor:pointer;font-weight:700">'+title+' ('+items.length+')</summary><div>'+rows+'</div></details>';
      };
      lists.innerHTML=
        section("Faculty",faculty,"faculty",x=>esc(x.name)+" · max "+x.max_daily_lectures+"/day")+
        section("Rooms",rooms,"rooms",x=>esc(x.room_number)+" · "+(x.is_lab?"Lab":"Classroom"))+
        section("Subjects",subjects,"subjects",x=>esc(x.name)+" · "+(x.is_practical?"Practical":"Theory"))+
        section("Batches",batches,"batches",x=>esc(x.name));
      lists.querySelectorAll(".pp-edit").forEach(b=>b.onclick=()=>editRecord(b.dataset.type,Number(b.dataset.id)));
      lists.querySelectorAll(".pp-delete").forEach(b=>b.onclick=()=>deleteRecord(b.dataset.type,Number(b.dataset.id)));
    }catch(e){if(showError)alert(e.message);}
  }

  async function editRecord(type,id){
    try{
      const data=await api("/"+type+"/"), item=data.find(x=>x.id===id);
      if(!item)return;
      let body;
      if(type==="faculty"){
        const name=prompt("Faculty name",item.name); if(name===null)return;
        const max=prompt("Maximum lectures per day",item.max_daily_lectures); if(max===null)return;
        body={name:name.trim(),max_daily_lectures:Math.max(1,parseInt(max,10)||1)};
      }else if(type==="rooms"){
        const room=prompt("Room number/name",item.room_number); if(room===null)return;
        body={room_number:room.trim(),is_lab:confirm("Is this a lab room? Click OK for Lab, Cancel for Classroom.")};
      }else if(type==="subjects"){
        const name=prompt("Subject name",item.name); if(name===null)return;
        body={name:name.trim(),is_practical:confirm("Is this a practical/lab subject? Click OK for Practical, Cancel for Theory.")};
      }else{
        const name=prompt("Batch name",item.name); if(name===null)return;
        body={name:name.trim()};
      }
      await api("/"+type+"/"+id,{method:"PUT",body:JSON.stringify(body)});
      const f=frame();
      if(f&&f.contentWindow&&typeof f.contentWindow.PP_refreshBackend==="function")await f.contentWindow.PP_refreshBackend();
      await loadManager(false);
      alert("Updated successfully.");
    }catch(e){alert("Update failed: "+e.message)}
  }

  async function deleteRecord(type,id){
    if(!confirm("Delete this "+type.slice(0,-1)+"?"))return;
    try{
      await api("/"+type+"/"+id,{method:"DELETE"});
      const f=frame();
      if(f&&f.contentWindow&&typeof f.contentWindow.PP_refreshBackend==="function")await f.contentWindow.PP_refreshBackend();
      await loadManager(false);
    }catch(e){alert("Delete failed: "+e.message+"\n\nIf this record is used by the generated timetable, click 'Clear generated timetable' first and then try again.")}
  }

  function stabilizeAdminScroll(){
    const f=frame();
    if(!f) return;
    try{
      const d=f.contentDocument;
      if(!d) return;
      d.documentElement.style.scrollBehavior="auto";
      d.body.style.scrollBehavior="auto";
      d.documentElement.style.overscrollBehavior="auto";
      d.body.style.overscrollBehavior="auto";
    }catch(e){}
  }

  function watchFrame(){
    const f=frame(); if(!f)return;
    const inject=()=>{
      try{
        const role=document.documentElement.dataset.role;
        if(role==="admin") renderManager();
      }catch(e){}
    };
    f.addEventListener("load",()=>setTimeout(inject,150));
    setInterval(inject,1200);
  }
  watchFrame();
  setInterval(stabilizeAdminScroll, 1200);
})();
</script>

<style id="pp-global-builder-style">
#pp-global-builder{position:fixed;inset:0;z-index:2147483647;display:none;align-items:center;justify-content:center;padding:18px;background:rgba(0,0,0,.78);backdrop-filter:blur(8px)}
#pp-global-builder.open{display:flex}
#pp-global-builder .ppgb-shell{position:relative;width:min(1220px,98vw);height:min(94vh,920px);background:#090908;border:1px solid rgba(255,255,255,.14);border-radius:18px;overflow:hidden;box-shadow:0 40px 120px rgba(0,0,0,.66)}
#pp-global-builder .ppgb-close{position:absolute;right:10px;top:10px;z-index:2;width:38px;height:38px;border:1px solid rgba(255,255,255,.14);border-radius:50%;background:rgba(0,0,0,.55);color:#fff;font-size:21px;cursor:pointer;line-height:36px}
#pp-global-builder iframe{display:block;width:100%;height:100%;border:0;background:#070706}
</style>
<div id="pp-global-builder" aria-hidden="true">
  <div class="ppgb-shell" role="dialog" aria-modal="true" aria-label="Build timetable">
    <button class="ppgb-close" id="ppgb-close" type="button" aria-label="Close">×</button>
    <iframe id="ppgb-frame" title="Build a new timetable" src="about:blank"></iframe>
  </div>
</div>
<script id="pp-global-builder-script">
(function(){
  const overlay=document.getElementById("pp-global-builder");
  const frame=document.getElementById("ppgb-frame");
  const closeBtn=document.getElementById("ppgb-close");
  const parentAPI=window.location.origin;
  if(!overlay||!frame)return;

  function isAdmin(){return document.documentElement.dataset.role==="admin";}
  function openBuilder(){
    if(!isAdmin())return;
    overlay.classList.add("open");
    overlay.setAttribute("aria-hidden","false");
    frame.src=parentAPI+"/timetable-builder?popup=1&v="+Date.now();
    document.body.dataset.ppBuilderOpen="1";
  }
  function closeBuilder(){
    overlay.classList.remove("open");
    overlay.setAttribute("aria-hidden","true");
    frame.src="about:blank";
    delete document.body.dataset.ppBuilderOpen;
  }
  window.PP_openRequirementsPopup=openBuilder;
  window.PP_closeRequirementsPopup=closeBuilder;

  closeBtn.addEventListener("click",closeBuilder);
  overlay.addEventListener("click",function(e){if(e.target===overlay)closeBuilder();});
  document.addEventListener("keydown",function(e){if(e.key==="Escape"&&overlay.classList.contains("open"))closeBuilder();},true);

  async function refreshAllRoleFrames(){
    const frames=[...document.querySelectorAll("iframe.dash")];
    for(const f of frames){
      try{
        if(f.contentWindow&&typeof f.contentWindow.PP_refreshBackend==="function"){
          await f.contentWindow.PP_refreshBackend();
        }
      }catch(err){}
    }
    try{
      const af=document.getElementById("view-admin");
      if(af&&af.contentWindow&&typeof af.contentWindow.__swxBackendStatus==="function"){
        af.contentWindow.__swxBackendStatus("Timetable generated · PostgreSQL synced");
      }
    }catch(err){}
  }

  window.addEventListener("message",async function(e){
    const data=e.data||{};
    if(data.type==="PP_TIMETABLE_BUILDER_CLOSE"){
      closeBuilder();
      return;
    }
    if(data.type==="PP_TIMETABLE_GENERATED"){
      closeBuilder();
      await refreshAllRoleFrames();
      try{window.dispatchEvent(new Event("pp-timetable-generated"));}catch(err){}
      return;
    }
  });

  function attachGenerateInterceptors(doc){
    if(!doc)return;
    try{
      doc.querySelectorAll("a,button").forEach(function(btn){
        const text=(btn.textContent||"").replace(/\s+/g," ").trim();
        if(!/^generate timetable$/i.test(text))return;
        if(btn.dataset.ppBuilderIntercept==="1")return;
        btn.dataset.ppBuilderIntercept="1";
        btn.addEventListener("click",function(ev){
          if(!isAdmin())return;
          ev.preventDefault();
          ev.stopPropagation();
          ev.stopImmediatePropagation();
          openBuilder();
        },true);
      });
    }catch(err){}
  }

  function attachToFrame(f){
    if(!f)return;
    const run=()=>{
      try{attachGenerateInterceptors(f.contentDocument);}catch(err){}
    };
    f.addEventListener("load",run);
    run();
  }

  function install(){
    document.querySelectorAll("iframe.dash").forEach(attachToFrame);
    if(!document.documentElement.dataset.ppDirectGenerateBridge){
      document.documentElement.dataset.ppDirectGenerateBridge="1";
      document.addEventListener("click",function(ev){
        if(!isAdmin())return;
        const el=ev.target&&ev.target.closest?ev.target.closest("a,button"):null;
        if(!el)return;
        const text=(el.textContent||"").replace(/\s+/g," ").trim();
        if(/^generate timetable$/i.test(text)){
          ev.preventDefault();
          ev.stopPropagation();
          ev.stopImmediatePropagation();
          openBuilder();
        }
      },true);
    }
  }

  if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",install);else install();
  setInterval(install,800);
})();
</script>
